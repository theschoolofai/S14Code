<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Wayfare — a trip planner that answers only in interfaces</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap">
<style>
  :root{
    --bg:#F6F7F9;--surface:#FFF;--surface-alt:#FAFAFA;--ink:#111;--ink-body:#1A1A1A;--ink-muted:#555;
    --rule:#E8E8E8;--rule-strong:#D0D0D0;--accent:#0F766E;--accent-soft:rgba(15,118,110,.09);
    --green:#16A34A;--green-soft:rgba(22,163,74,.12);--green-ink:#15803D;
    --amber:#D97706;--amber-soft:rgba(217,119,6,.14);--amber-ink:#B45309;
    --red:#DC2626;--red-soft:rgba(220,38,38,.10);--red-ink:#B91C1C;
    --font-sans:'Inter',system-ui,sans-serif;--font-serif:'Palatino Linotype',Palatino,Georgia,serif;--font-mono:'JetBrains Mono',ui-monospace,Menlo,monospace;
  }
  *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink-body);font-family:var(--font-sans);font-size:15px}
  .wrap{max-width:760px;margin:0 auto;padding:22px 18px 64px}
  .head{display:flex;gap:10px;align-items:baseline;margin-bottom:4px}
  .head h1{font-family:var(--font-serif);font-size:23px;margin:0;color:var(--ink)}
  .head .sub{font-family:var(--font-mono);font-size:11px;letter-spacing:.05em;text-transform:uppercase;color:var(--ink-muted)}
  .startbar{display:flex;gap:8px;margin:14px 0 12px}
  .startbar input{flex:1;padding:11px 14px;border:1px solid var(--rule-strong);border-radius:10px;font-size:15px;font-family:var(--font-sans)}
  .startbar input:focus{outline:none;border-color:var(--accent)}
  .startbar button{padding:11px 18px;border:none;border-radius:10px;background:var(--ink);color:#fff;font-weight:600;font-size:14px;cursor:pointer}
  .status{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-family:var(--font-mono);font-size:12px;color:var(--ink-muted);min-height:20px;margin-bottom:10px}
  .pill{padding:2px 9px;border-radius:999px;font-weight:600;font-size:11px}
  .pill.good{background:var(--green-soft);color:var(--green-ink)}
  .pill.think{background:var(--accent-soft);color:var(--accent)}
  .pill.bad{background:var(--red-soft);color:var(--red-ink)}
  .screen{background:var(--surface);border:1px solid var(--rule);border-radius:16px;padding:22px;box-shadow:0 4px 16px -8px rgba(0,20,60,.12);min-height:140px}
  .empty{color:var(--ink-muted);font-style:italic;text-align:center;padding:34px 12px;line-height:1.6}
  .trail{font-family:var(--font-mono);font-size:11px;color:var(--ink-muted);margin-top:12px;line-height:1.6}
  .trail button{margin-left:8px;border:1px solid var(--rule-strong);background:var(--surface);border-radius:999px;padding:2px 10px;font-size:10px;font-family:var(--font-mono);cursor:pointer;color:var(--ink-muted)}
  /* --- component styles: one class per catalog type --- */
  .Text{color:var(--ink-body);line-height:1.62;margin:2px 0}
  .Text.heading{font-family:var(--font-serif);font-size:26px;font-weight:700;color:var(--ink);margin:0 0 6px}
  .Text.subtitle{font-style:italic;color:var(--ink-muted);font-size:16px}
  .Text.caption{font-size:12px;color:var(--ink-muted);font-family:var(--font-mono)}
  .Column{display:flex;flex-direction:column;gap:14px}
  .List{display:flex;flex-direction:column;gap:10px}
  .Row{display:flex;gap:12px;align-items:stretch;flex-wrap:wrap}
  .Row>.StatTile,.Row>.chart,.Row>.Rating,.Row>.Card{flex:1;min-width:140px}
  .Card{background:var(--surface-alt);border:1px solid var(--rule);border-radius:12px;padding:14px 16px}
  .Card>.ct{font-weight:600;margin-bottom:8px;color:var(--ink)}
  .Divider{height:1px;background:var(--rule)}
  .StatTile{background:var(--surface);border:1px solid var(--rule);border-top:3px solid var(--accent);border-radius:12px;padding:14px}
  .StatTile.good{border-top-color:var(--green)}.StatTile.warn{border-top-color:var(--amber)}.StatTile.bad{border-top-color:var(--red)}
  .StatTile .lab{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-muted);font-weight:600;font-family:var(--font-mono)}
  .StatTile .val{font-size:27px;font-weight:700;color:var(--ink);margin-top:5px;line-height:1.15}
  .StatTile .dl{font-size:11px;color:var(--ink-muted);margin-top:3px}
  .chart{background:var(--surface);border:1px solid var(--rule);border-radius:12px;padding:14px}
  .chart .ct{font-size:12px;font-weight:600;color:var(--ink-muted);margin-bottom:8px;font-family:var(--font-mono)}
  .prog{height:12px;border-radius:999px;background:var(--surface-alt);border:1px solid var(--rule);overflow:hidden}.prog>i{display:block;height:100%;background:var(--green)}
  table{width:100%;border-collapse:collapse;background:var(--surface);border:1px solid var(--rule);border-radius:12px;overflow:hidden}
  th,td{text-align:left;padding:9px 12px;border-bottom:1px solid var(--rule);font-size:14px}
  th{font-family:var(--font-mono);font-size:11px;text-transform:uppercase;color:var(--ink-muted);background:var(--surface-alt)}
  tr:last-child td{border-bottom:none}
  .tabs{display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap}
  .tabs button{border:1px solid var(--rule-strong);background:var(--surface);border-radius:999px;padding:5px 13px;font-size:13px;font-weight:600;cursor:pointer;font-family:var(--font-mono);color:var(--ink-muted)}
  .tabs button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
  .Notice{border-left:4px solid var(--amber);background:var(--amber-soft);border-radius:10px;padding:12px 14px;line-height:1.55}
  .Notice.bad{border-left-color:var(--red);background:var(--red-soft)}
  .actbtn{width:100%;text-align:center;border:1px solid var(--rule-strong);background:var(--surface);border-radius:12px;padding:13px;font-weight:600;font-size:15px;cursor:pointer;color:var(--ink);transition:all 120ms}
  .actbtn:hover{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
  .actbtn:active{transform:translateY(1px)}
  .tl{display:flex;flex-direction:column;gap:9px;margin-top:4px}
  .tl .r{display:flex;gap:10px;align-items:flex-start;font-size:14px;line-height:1.5}
  .tl .dot{color:var(--accent);font-size:10px;margin-top:5px}
  .tl .when{font-family:var(--font-mono);font-size:11px;color:var(--ink-muted);min-width:76px}
  input.field,select.field{padding:9px 11px;border:1px solid var(--rule-strong);border-radius:9px;font-size:14px;font-family:var(--font-sans)}
  .skipped{color:var(--red-ink);font-family:var(--font-mono);font-size:11px}
  /* student extensions */
  .mapnote{font-family:var(--font-mono);font-size:11px;color:var(--ink-muted);margin-top:8px;line-height:1.5}
  .calhead{font-weight:700;color:var(--ink);margin-bottom:8px}
  table.cal td{vertical-align:top;height:52px;width:14.28%;border-right:1px solid var(--rule)}
  table.cal td:last-child,table.cal th:last-child{border-right:none}
  table.cal th{text-align:center}
  table.cal td.pad{background:var(--surface-alt)}
  table.cal td.has{background:var(--accent-soft)}
  table.cal td.tap{cursor:pointer}table.cal td.tap:hover{outline:2px solid var(--accent);outline-offset:-2px}
  table.cal .dnum{font-family:var(--font-mono);font-size:11px;color:var(--ink-muted)}
  table.cal .dlab{font-size:11px;color:var(--ink-body);line-height:1.35;margin-top:2px}
  .Rating{background:var(--surface);border:1px solid var(--rule);border-radius:12px;padding:12px 14px}
  .Rating .lab{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-muted);font-weight:600;font-family:var(--font-mono)}
  .Rating .stars{display:flex;align-items:center;gap:2px;margin-top:5px;font-size:20px;color:var(--accent)}
  .Rating .stars.good{color:var(--green)}.Rating .stars.warn{color:var(--amber)}.Rating .stars.bad{color:var(--red)}
  .Rating .star.tap{cursor:pointer}
  .Rating .rnum{margin-left:8px;font-size:13px;font-weight:600;color:var(--ink);font-family:var(--font-mono)}
  .Rating .rcount{font-size:11px;color:var(--ink-muted);margin-top:3px;font-family:var(--font-mono)}
  /* safe markdown, built as DOM */
  .Text .md-h{font-weight:700;color:var(--ink);margin:12px 0 4px}
  .Text .md-p{margin:6px 0;line-height:1.62}
  .Text .md-ul{margin:6px 0 6px 4px;padding-left:18px}
  .Text .md-ul li{margin:3px 0;line-height:1.55}
</style>
</head>
<body>
<div class="wrap">
  <div class="head"><h1>Wayfare</h1><span class="sub">every turn is a composed interface · never a paragraph</span></div>
  <div class="startbar">
    <input id="prompt" value="Plan a five-day trip through Japan from 21 September 2026: what to do on each date, roughly where those places sit geographically, how well reviewed each place I would stay is, and what each day costs. Then let me choose which day to open in detail." />
    <button id="ask">Plan it</button>
  </div>
  <div class="status" id="status"></div>
  <div class="screen"><div id="mount"><div class="empty">Describe a trip and press Plan it.<br>Every reply is an interface the agent composes from the trusted catalog — tap it to earn the next one.</div></div></div>
  <div class="trail" id="trail"></div>
</div>
<script>
// ---------------------------------------------------------------------------
// A UI-only trip planner. The agent never answers in prose: each turn is a
// declarative component tree read from /v1/runs/{id}/composed, validated against
// the catalog server-side, and drawn here from text nodes. This client NEVER sets
// innerHTML from any value and NEVER evaluates a string, so nothing the model
// wrote can execute. A tap is the only way the interface changes the world, and
// it may only carry an action name the catalog registered.
// ---------------------------------------------------------------------------
const API = "";                 // same origin as the runtime (8113)
let ACTIONS = new Set();        // the registered action names, from /v1/catalog
let goal = "";                  // turn 1's prompt
let trail = [];                 // the taps since: [{phrase}]
let busy = false;

const $ = (t,c)=>{const e=document.createElement(t);if(c)e.className=c;return e;};
const T = t=>document.createTextNode(t==null?"":String(t));
const resolve=(v,dm)=>(v&&typeof v==="object"&&"$bind"in v)?ptr(dm,v["$bind"]):v;
function ptr(dm,p){let c=dm;for(const s of String(p).split("/").slice(1)){if(c==null)return null;c=c[s];}return c;}
const MONTHS=["January","February","March","April","May","June","July","August","September","October","November","December"];

// ---- safe markdown: model text becomes DOM through createElement + text nodes,
// so any HTML or script inside it stays visible, literal, inert text. ----
function mdInline(line,parent){
  const re=/(\*\*([^*]+)\*\*|\*([^*]+)\*|_([^_]+)_)/g;let last=0,m;
  while((m=re.exec(line))){
    if(m.index>last)parent.append(T(line.slice(last,m.index)));
    if(m[2]!=null){const s=document.createElement("strong");s.textContent=m[2];parent.append(s);}
    else{const e=document.createElement("em");e.textContent=(m[3]!=null?m[3]:m[4]);parent.append(e);}
    last=re.lastIndex;
  }
  if(last<line.length)parent.append(T(line.slice(last)));
}
function md(text){
  const frag=document.createDocumentFragment();let ul=null;
  for(const raw of String(text==null?"":text).split(/\r?\n/)){
    const line=raw.trim();if(!line){ul=null;continue;}
    const h=line.match(/^(#{1,4})\s+(.*)/),b=line.match(/^[*\-]\s+(.*)/);
    if(h){ul=null;const d=$("div","md-h");mdInline(h[2],d);frag.append(d);}
    else if(b){if(!ul){ul=document.createElement("ul");ul.className="md-ul";frag.append(ul);}const li=document.createElement("li");mdInline(b[1],li);ul.append(li);}
    else{ul=null;const p=$("div","md-p");mdInline(line,p);frag.append(p);}
  }
  return frag;
}

// ---- the renderers: one per catalog type, DOM only ----
const R={
  Column:(c,x)=>{const e=$("div","Column");kids(c,x,e);return e;},
  Row:(c,x)=>{const e=$("div","Row");kids(c,x,e);return e;},
  List:(c,x)=>{const e=$("div","List");kids(c,x,e);return e;},
  Card:(c,x)=>{const e=$("div","Card");if(c.title){const h=$("div","ct");h.append(T(c.title));e.append(h);}kids(c,x,e);return e;},
  Divider:()=>$("div","Divider"),
  Text:(c,x)=>{const e=$("div","Text "+(c.variant||"body"));const v=resolve(c.text,x.dm);
    if((c.variant||"body")==="heading")e.append(T(v));else e.append(md(v));return e;},
  Notice:(c,x)=>{const e=$("div","Notice "+(c.tone==="bad"?"bad":""));e.append(T(resolve(c.text,x.dm)));return e;},
  StatTile:(c,x)=>{const e=$("div","StatTile "+(c.tone||"neutral"));const l=$("div","lab");l.append(T(c.label));
    const v=$("div","val");v.append(T(String(resolve(c.value,x.dm))+(c.unit?" "+c.unit:"")));
    const d=$("div","dl");d.append(T(resolve(c.delta,x.dm)||""));e.append(l,v,d);return e;},
  ProgressBar:(c,x)=>{const e=$("div","chart");const t=$("div","ct");t.append(T("progress"));
    const p=$("div","prog");const i=$("i");const val=+resolve(c.value,x.dm)||0;
    i.style.width=Math.min(100,val/(+c.max||100)*100)+"%";p.append(i);e.append(t,p);return e;},
  Sparkline:(c,x)=>{const e=$("div","chart");const t=$("div","ct");t.append(T("trend"));e.append(t,spark(resolve(c.data,x.dm)||[]));return e;},
  BarChart:(c,x)=>{const e=$("div","chart");const t=$("div","ct");t.append(T(c.title||"chart"));e.append(t,bars(resolve(c.data,x.dm)||[],c.xKey||"label",c.yKey||"value"));return e;},
  DataTable:(c,x)=>tableOf(c,x),
  Timeline:(c,x)=>{const e=$("div","chart");const t=$("div","ct");t.append(T(c.title||"timeline"));
    const b=$("div","tl");(resolve(c.events,x.dm)||[]).forEach(ev=>{const r=$("div","r");
      const dot=$("span","dot");dot.append(T("●"));
      const w=$("span","when");w.append(T(ev&&ev.time!=null?ev.time:""));
      const lab=$("div");lab.style.flex="1";mdInline(String(ev&&ev.label!=null?ev.label:(ev&&ev.kind!=null?ev.kind:"")),lab);
      r.append(dot,w,lab);b.append(r);});e.append(t,b);return e;},
  Tabs:(c,x)=>tabsOf(c,x),
  Modal:(c,x)=>{const e=$("div","Card");if(c.title){const h=$("div","ct");h.append(T(c.title));e.append(h);}kids(c,x,e);return e;},
  Button:(c,x)=>{const b=$("button","actbtn");let lab=resolve(c.label,x.dm);
    if(lab&&typeof lab==="object")lab=lab.label||lab.name||lab.text||lab.id||"Choose";
    lab=String(lab==null?"Choose":lab);b.append(T(lab));
    b.onclick=()=>tap(c.onPress&&c.onPress.action,{choice:lab},lab);return b;},
  Image:()=>{const e=$("div","chart");e.append(T("[image omitted — the catalog approves no remote fetch here]"));return e;},
  TextField:(c)=>{const w=$("div");if(c.label){const l=$("div","lab");l.append(T(c.label));w.append(l);}
    const i=$("input","field");if(c.placeholder)i.placeholder=c.placeholder;w.append(i);return w;},
  CheckBox:(c)=>{const w=$("label");w.style.cssText="display:flex;gap:8px;align-items:center";
    const i=document.createElement("input");i.type="checkbox";w.append(i,T(c.label||""));return w;},
  Slider:(c)=>{const w=$("div");if(c.label){const l=$("div","lab");l.append(T(c.label));w.append(l);}
    const i=document.createElement("input");i.type="range";i.min=+c.min||0;i.max=+c.max||100;w.append(i);return w;},
  InputChoice:(c,x)=>{const s=$("select","field");(resolve(c.options,x.dm)||[]).forEach(o=>{
    const op=document.createElement("option");op.append(T(o&&typeof o==="object"?(o.label||o.name||o.id):o));s.append(op);});return s;},
  DateTime:()=>{const i=$("input","field");i.type="date";return i;},
  ApprovalCard:(c,x)=>{const e=$("div","Card");const s=$("div","ct");s.append(T(resolve(c.summary,x.dm)||"Approve?"));
    const pre=document.createElement("pre");pre.style.cssText="font-size:12px;background:var(--surface-alt);padding:8px;border-radius:8px;overflow:auto";
    pre.append(T(JSON.stringify(resolve(c.params,x.dm),null,2)));
    const ok=$("button","actbtn");ok.append(T("Approve"));
    ok.onclick=()=>tap(c.confirm&&c.confirm.action,{},"approved");e.append(s,pre,ok);return e;},
  // --- student extensions --------------------------------------------------
  Map:(c,x)=>{const e=$("div","chart");const t=$("div","ct");t.append(T(c.title||"map"));e.append(t);
    const kLa=c.latKey||"lat",kLo=c.lonKey||"lon",kLb=c.labelKey||"label";
    const raw=resolve(c.points,x.dm);
    const pts=(Array.isArray(raw)?raw:[]).map(p=>({label:(p&&p[kLb]!=null)?String(p[kLb]):"",la:+((p||{})[kLa]),lo:+((p||{})[kLo])}))
      .filter(p=>isFinite(p.la)&&isFinite(p.lo));
    if(!pts.length){const n=$("div","mapnote");n.append(T("no coordinates available — nothing drawn"));e.append(n);return e;}
    // Coordinates, projected here. No tile URL, no iframe, no network.
    const ns="http://www.w3.org/2000/svg",w=320,h=190,pad=28;
    const la0=Math.min(...pts.map(p=>p.la)),la1=Math.max(...pts.map(p=>p.la));
    const lo0=Math.min(...pts.map(p=>p.lo)),lo1=Math.max(...pts.map(p=>p.lo));
    const sLa=(la1-la0)||1,sLo=(lo1-lo0)||1;
    const X=lo=>pad+((lo-lo0)/sLo)*(w-pad*2),Y=la=>h-pad-((la-la0)/sLa)*(h-pad*2);
    const svg=document.createElementNS(ns,"svg");svg.setAttribute("viewBox","0 0 "+w+" "+h);svg.setAttribute("width","100%");
    const fr=document.createElementNS(ns,"rect");fr.setAttribute("x",5);fr.setAttribute("y",5);fr.setAttribute("width",w-10);
    fr.setAttribute("height",h-10);fr.setAttribute("rx",8);fr.setAttribute("fill","var(--surface-alt)");fr.setAttribute("stroke","var(--rule)");svg.append(fr);
    if(pts.length>1){const pl=document.createElementNS(ns,"polyline");pl.setAttribute("points",pts.map(p=>X(p.lo)+","+Y(p.la)).join(" "));
      pl.setAttribute("fill","none");pl.setAttribute("stroke","var(--accent)");pl.setAttribute("stroke-width","1.5");pl.setAttribute("stroke-dasharray","4 3");svg.append(pl);}
    pts.forEach(p=>{const cx=X(p.lo),cy=Y(p.la);
      const d=document.createElementNS(ns,"circle");d.setAttribute("cx",cx);d.setAttribute("cy",cy);d.setAttribute("r",5);
      d.setAttribute("fill","var(--accent)");d.setAttribute("fill-opacity",".85");svg.append(d);
      const lb=document.createElementNS(ns,"text");lb.setAttribute("x",cx);lb.setAttribute("y",cy-9);lb.setAttribute("text-anchor","middle");
      lb.setAttribute("font-size","10");lb.setAttribute("fill","var(--ink-muted)");lb.textContent=p.label;svg.append(lb);});
    e.append(svg);
    const cap=$("div","mapnote");cap.append(T(pts.map(p=>p.label+" ("+p.la.toFixed(2)+", "+p.lo.toFixed(2)+")").join(" · ")));e.append(cap);return e;},
  Calendar:(c,x)=>{const e=$("div","chart");const t=$("div","ct");t.append(T(c.title||"calendar"));e.append(t);
    const evs=resolve(c.events,x.dm)||[],m=resolve(c.month,x.dm);
    const ym=(typeof m==="string"&&/^\d{4}-\d{2}/.test(m))?m.slice(0,7)
      :((Array.isArray(evs)?evs:[]).map(v=>String((v||{}).date||"")).filter(d=>/^\d{4}-\d{2}/.test(d)).sort()[0]||"").slice(0,7);
    if(!ym){const n=$("div","mapnote");n.append(T("no dated entries available — nothing drawn"));e.append(n);return e;}
    const by={};(Array.isArray(evs)?evs:[]).forEach(v=>{if(!v||typeof v!=="object")return;
      const d=String(v.date||"");if(d.slice(0,7)!==ym)return;const k=+d.slice(8,10);
      if(k>=1&&k<=31)(by[k]=by[k]||[]).push(String(v.label==null?"":v.label));});
    const y=+ym.slice(0,4),mo=+ym.slice(5,7);
    const head=$("div","calhead");head.append(T((MONTHS[mo-1]||ym)+" "+y));e.append(head);
    const tab=$("table","cal");const hr=$("tr");
    ["Mo","Tu","We","Th","Fr","Sa","Su"].forEach(d=>{const th=$("th");th.append(T(d));hr.append(th);});tab.append(hr);
    const lead=(new Date(Date.UTC(y,mo-1,1)).getUTCDay()+6)%7,days=new Date(Date.UTC(y,mo,0)).getUTCDate();
    let row=$("tr");for(let i=0;i<lead;i++)row.append($("td","pad"));
    for(let d=1;d<=days;d++){
      const td=$("td",by[d]?"has":"");const n=$("div","dnum");n.append(T(String(d)));td.append(n);
      if(by[d]){const l=$("div","dlab");l.append(T(by[d].join(", ")));td.append(l);
        if(c.onSelect&&c.onSelect.action){const iso=ym+"-"+String(d).padStart(2,"0");
          td.classList.add("tap");
          td.onclick=()=>tap(c.onSelect.action,{date:iso},"the day "+iso+" ("+by[d][0]+")");}}
      row.append(td);if((lead+d)%7===0){tab.append(row);row=$("tr");}}
    if(row.children.length){while(row.children.length<7)row.append($("td","pad"));tab.append(row);}
    e.append(tab);return e;},
  Rating:(c,x)=>{const e=$("div","Rating");const max=Math.max(1,Math.min(10,Math.round(+c.max||5)));
    let v=+resolve(c.value,x.dm);if(!isFinite(v))v=0;v=Math.max(0,Math.min(max,v));
    if(c.label){const l=$("div","lab");l.append(T(c.label));e.append(l);}
    const row=$("div","stars "+(c.tone||"neutral"));
    for(let i=1;i<=max;i++){const s=$("span","star");s.append(T(i<=Math.round(v)?"★":"☆"));
      if(c.onRate&&c.onRate.action){s.classList.add("tap");
        s.onclick=()=>tap(c.onRate.action,{value:i},(c.label||"this option")+" rated "+i+" of "+max);}
      row.append(s);}
    const num=$("span","rnum");num.append(T(v.toFixed(1)+" / "+max));row.append(num);e.append(row);
    const cnt=resolve(c.count,x.dm);
    if(cnt!=null&&String(cnt)!==""){const k=$("div","rcount");k.append(T(String(cnt)));e.append(k);}
    return e;},
};

function kids(c,x,e){for(const id of (c.children||[])){const ch=x.byId[id];if(ch)e.append(node(ch,x));}}
function node(c,x){const f=R[c.type];
  if(!f){const s=$("div","skipped");s.append(T("[skipped unknown type: "+c.type+"]"));return s;}
  return f(c,x);}

function spark(v){const ns="http://www.w3.org/2000/svg",w=200,h=44;
  const vals=(Array.isArray(v)?v:[]).map(Number).filter(isFinite);if(!vals.length)return $("div");
  const mx=Math.max(...vals,1),mn=Math.min(...vals,0),rg=(mx-mn)||1;
  const s=document.createElementNS(ns,"svg");s.setAttribute("viewBox","0 0 "+w+" "+h);s.setAttribute("width","100%");s.setAttribute("height",h);
  const p=document.createElementNS(ns,"polyline");
  p.setAttribute("points",vals.map((y,i)=>(i/(vals.length-1||1)*w)+","+(h-5-(y-mn)/rg*(h-10))).join(" "));
  p.setAttribute("fill","none");p.setAttribute("stroke","var(--green)");p.setAttribute("stroke-width","2.5");s.append(p);return s;}

function bars(d,xk,yk){const ns="http://www.w3.org/2000/svg",w=300,h=150,pad=26;
  const rows=(Array.isArray(d)?d:[]).filter(r=>r&&isFinite(+r[yk]));if(!rows.length)return $("div");
  const mx=Math.max(...rows.map(r=>+r[yk]),1),slot=(w-pad*2)/rows.length,bw=slot*.62;
  const s=document.createElementNS(ns,"svg");s.setAttribute("viewBox","0 0 "+w+" "+h);s.setAttribute("width","100%");
  rows.forEach((r,i)=>{const x=pad+i*slot+(slot-bw)/2,bh=(+r[yk])/mx*(h-pad*2);
    const rc=document.createElementNS(ns,"rect");rc.setAttribute("x",x);rc.setAttribute("y",h-pad-bh);
    rc.setAttribute("width",bw);rc.setAttribute("height",bh);rc.setAttribute("rx",3);rc.setAttribute("fill","var(--accent)");s.append(rc);
    const tv=document.createElementNS(ns,"text");tv.setAttribute("x",x+bw/2);tv.setAttribute("y",h-pad-bh-4);
    tv.setAttribute("text-anchor","middle");tv.setAttribute("font-size","9");tv.setAttribute("fill","var(--ink-muted)");tv.textContent=r[yk];s.append(tv);
    const tl=document.createElementNS(ns,"text");tl.setAttribute("x",x+bw/2);tl.setAttribute("y",h-8);
    tl.setAttribute("text-anchor","middle");tl.setAttribute("font-size","9");tl.setAttribute("fill","var(--ink-muted)");tl.textContent=r[xk];s.append(tl);});
  return s;}

function tableOf(c,x){const wrap=$("div");const rows=resolve(c.rows,x.dm)||[];
  let cols=String(c.columns||"").split(",").map(s=>s.trim()).filter(Boolean);
  if(!cols.length&&rows.length&&rows[0]&&typeof rows[0]==="object")cols=Object.keys(rows[0]);
  const t=$("table");const hr=$("tr");cols.forEach(col=>{const th=$("th");th.append(T(col));hr.append(th);});t.append(hr);
  rows.forEach(r=>{const rr=$("tr");cols.forEach(col=>{const td=$("td");td.append(T(r?r[col]:""));rr.append(td);});t.append(rr);});
  wrap.append(t);return wrap;}

function tabsOf(c,x){const wrap=$("div");const nav=$("div","tabs");const body=$("div");wrap.append(nav,body);
  const ids=c.children||[];
  function show(i){body.textContent="";const cc=x.byId[ids[i]];if(cc)body.append(node(cc,x));
    [...nav.children].forEach((b,j)=>b.classList.toggle("on",i===j));}
  String(c.labels||"").split(",").forEach((lab,i)=>{const b=$("button");b.append(T(lab.trim()||("tab "+(i+1))));b.onclick=()=>show(i);nav.append(b);});
  if(ids.length)show(0);return wrap;}

function render(surface){const byId={};(surface.components||[]).forEach(c=>byId[c.id]=c);
  const x={byId,dm:surface.dataModel||{}};const m=document.getElementById("mount");m.textContent="";
  const root=byId[surface.root]||surface.components[0];
  if(root)m.append(node(root,x));}

// ---- status / trail: textContent only, never innerHTML ----
function setStatus(parts){const s=document.getElementById("status");s.textContent="";
  parts.forEach(p=>{if(typeof p==="string"){s.append(T(p));return;}
    const pill=$("span","pill "+(p.tone||"good"));pill.append(T(p.text));s.append(pill);});}
function drawTrail(){const el=document.getElementById("trail");el.textContent="";
  if(!goal)return;
  el.append(T("turn 1: "+goal));
  trail.forEach((t,i)=>el.append(T("   ›   turn "+(i+2)+": tapped "+t.phrase)));
  if(trail.length){const b=$("button");b.append(T("start over"));b.onclick=()=>{trail=[];runTurn();};el.append(b);}}

// ---- a tap: the ONLY way this interface changes anything. The action name must
// be one the catalog registered, or it is refused here and never becomes a turn.
function tap(action,args,phrase){
  if(busy)return;
  if(!action||!ACTIONS.has(action)){
    setStatus([{text:"action refused",tone:"bad"},
      'the interface tried to emit "'+String(action)+'", which the catalog never registered — it did not cross back']);
    return;
  }
  trail.push({action:action,args:args||{},phrase:phrase||action});
  runTurn();
}

// ---- one turn: prompt -> run -> composed interface -> render ----
function turnPrompt(){
  if(!trail.length)return goal;
  return goal+"\nThe traveller has since tapped: "+trail.map(t=>t.phrase).join(", then ")+
    ".\nCompose the next interface for exactly that, going one level deeper than the last one.";
}

async function runTurn(){
  busy=true;drawTrail();
  setStatus([{text:"composing…",tone:"think"},"turn "+(trail.length+1)+" — the agent is writing an interface"]);
  try{
    const res=await fetch(API+"/v1/agent/runs",{method:"POST",headers:{"Content-Type":"application/json"},
      body:JSON.stringify({prompt:turnPrompt(),respond_as:"ui",tenant_id:"course",project_id:"s14-trip",
                           user_id:"traveller-01",agent_id:"wayfare"})});
    if(!res.ok)throw new Error("run failed: HTTP "+res.status);
    const run=await res.json();
    const composed=await fetch(API+"/v1/runs/"+run.run_id+"/composed");
    if(composed.status===404){
      showNotice("This turn produced no composed interface, so there is nothing honest to draw. "+
                 "The run finished without a compose_surface node — no interface has been invented for it.");
      setStatus([{text:"no interface",tone:"bad"},"run "+run.run_id]);
      return;
    }
    const c=await composed.json();
    if(!c.surface||!(c.surface.components||[]).length){
      showNotice("The composed interface came back empty after validation. Nothing is drawn rather than something invented.");
      setStatus([{text:"empty surface",tone:"bad"},"run "+run.run_id]);
      return;
    }
    render(c.surface);
    const types=[...new Set(c.surface.components.map(k=>k.type))].sort().join(", ");
    setStatus([{text:(c.provider||"gateway")+" · "+c.component_count+" components · 0 executable",tone:"good"},
               (c.clean?"validated in-catalog":"partly rejected — safe part rendered")+" · "+types]);
  }catch(err){
    showNotice("The turn could not be completed: "+err.message+
               ". Nothing is drawn for it — the interface shows no data it does not have.");
    setStatus([{text:"turn failed",tone:"bad"},String(err.message)]);
  }finally{busy=false;drawTrail();}
}

function showNotice(msg){const m=document.getElementById("mount");m.textContent="";
  const n=$("div","Notice bad");n.append(T(msg));m.append(n);}

// ---- boot: learn the registered actions from the catalog itself ----
(async()=>{try{const cat=await (await fetch(API+"/v1/catalog")).json();
  ACTIONS=new Set(cat.actions||[]);}catch(e){ACTIONS=new Set();}})();

document.getElementById("ask").onclick=()=>{
  const v=document.getElementById("prompt").value.trim();if(!v||busy)return;
  goal=v;trail=[];runTurn();};
document.getElementById("prompt").addEventListener("keydown",e=>{
  if(e.key==="Enter")document.getElementById("ask").click();});
</script>
</body>
</html>
