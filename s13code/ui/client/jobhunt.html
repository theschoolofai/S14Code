<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Career Pipeline — the agent answers only in interfaces</title>
<style>
  :root{
    --bg:#F7F8FA;--surface:#FFF;--surface-alt:#FAFAFA;--ink:#111;--ink-body:#1A1A1A;--ink-muted:#555;
    --rule:#E8E8E8;--rule-strong:#D0D0D0;--accent:#2563EB;--accent-soft:rgba(37,99,235,.08);
    --green:#16A34A;--green-soft:rgba(22,163,74,.12);--green-ink:#15803D;
    --amber:#D97706;--amber-soft:rgba(217,119,6,.14);--amber-ink:#B45309;
    --red:#DC2626;--red-soft:rgba(220,38,38,.10);--red-ink:#B91C1C;
    --font-sans:system-ui,-apple-system,'Segoe UI',sans-serif;--font-serif:'Palatino Linotype',Palatino,Georgia,serif;
    --font-mono:ui-monospace,'Cascadia Mono',Menlo,Consolas,monospace;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink-body);font-family:var(--font-sans);font-size:15px}
  .wrap{max-width:860px;margin:0 auto;padding:20px 18px 60px}
  .head{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap;margin-bottom:2px}
  .head h1{font-family:var(--font-serif);font-size:23px;margin:0;color:var(--ink)}
  .head .sub{font-family:var(--font-mono);font-size:11px;letter-spacing:.05em;text-transform:uppercase;color:var(--ink-muted)}
  .rule{height:1px;background:var(--rule);margin:12px 0 14px}
  .starters{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:10px}
  .starters button{border:1px solid var(--rule-strong);background:var(--surface);border-radius:999px;padding:6px 13px;font-size:12.5px;cursor:pointer;color:var(--ink-muted);font-family:inherit}
  .starters button:hover{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
  .startbar{display:flex;gap:8px;margin-bottom:12px}
  .startbar input{flex:1;padding:11px 14px;border:1px solid var(--rule-strong);border-radius:10px;font-size:15px;font-family:inherit;background:var(--surface)}
  .startbar input:focus{outline:none;border-color:var(--accent)}
  .startbar button{padding:11px 20px;border:none;border-radius:10px;background:var(--ink);color:#fff;font-weight:600;font-size:14px;cursor:pointer;font-family:inherit}
  .status{font-family:var(--font-mono);font-size:11.5px;color:var(--ink-muted);min-height:20px;margin-bottom:10px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .pill{padding:2px 9px;border-radius:999px;font-weight:600;font-size:11px}
  .pill.good{background:var(--green-soft);color:var(--green-ink)}
  .pill.think{background:var(--accent-soft);color:var(--accent)}
  .pill.bad{background:var(--red-soft);color:var(--red-ink)}
  .screen{background:var(--surface);border:1px solid var(--rule);border-radius:16px;padding:22px;box-shadow:0 4px 16px -8px rgba(0,20,60,.12);min-height:140px}
  .empty{color:var(--ink-muted);font-style:italic;text-align:center;padding:36px 0}
  .crumbs{font-family:var(--font-mono);font-size:11px;color:var(--ink-muted);margin-top:12px;line-height:1.6}
  .refused{margin-top:12px;border:1px solid var(--red);background:var(--red-soft);border-radius:10px;padding:11px 13px;font-size:12.5px}
  .refused h4{margin:0 0 6px;font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--red-ink);font-family:var(--font-mono)}
  .refused li{margin:3px 0;font-family:var(--font-mono);font-size:11.5px;color:var(--ink-body)}
  /* ---- catalog component styles ---- */
  .Text{color:var(--ink-body);line-height:1.6;white-space:pre-wrap;margin:2px 0}
  .Text.heading{font-family:var(--font-serif);font-size:25px;font-weight:700;color:var(--ink);white-space:normal;margin:0 0 4px}
  .Text.subtitle{font-style:italic;color:var(--ink-muted);font-size:16px}
  .Text.caption{font-size:12px;color:var(--ink-muted);font-family:var(--font-mono)}
  .Column{display:flex;flex-direction:column;gap:14px}
  .List{display:flex;flex-direction:column;gap:10px}
  .Row{display:flex;gap:12px;align-items:stretch;flex-wrap:wrap}
  .Row>.StatTile,.Row>.chart,.Row>.Card{flex:1;min-width:130px}
  .Card{background:var(--surface-alt);border:1px solid var(--rule);border-radius:12px;padding:14px 16px}
  .Card>.ct{font-weight:600;margin-bottom:8px;color:var(--ink)}
  .Divider{height:1px;background:var(--rule)}
  .StatTile{background:var(--surface);border:1px solid var(--rule);border-top:3px solid var(--accent);border-radius:12px;padding:14px}
  .StatTile.good{border-top-color:var(--green)}.StatTile.warn{border-top-color:var(--amber)}.StatTile.bad{border-top-color:var(--red)}
  .StatTile .lab{font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-muted);font-weight:600;font-family:var(--font-mono)}
  .StatTile .val{font-size:26px;font-weight:700;color:var(--ink);margin-top:5px;line-height:1.15}
  .StatTile .dl{font-size:11px;color:var(--ink-muted);margin-top:3px}
  .chart{background:var(--surface);border:1px solid var(--rule);border-radius:12px;padding:14px}
  .chart .ct{font-size:11.5px;font-weight:600;color:var(--ink-muted);margin-bottom:8px;font-family:var(--font-mono);text-transform:uppercase;letter-spacing:.04em}
  .prog{height:11px;border-radius:999px;background:var(--surface-alt);border:1px solid var(--rule);overflow:hidden}
  .prog>i{display:block;height:100%;background:var(--green)}
  table{width:100%;border-collapse:collapse;background:var(--surface);border:1px solid var(--rule);border-radius:12px;overflow:hidden}
  th,td{text-align:left;padding:9px 12px;border-bottom:1px solid var(--rule);font-size:13.5px}
  th{font-family:var(--font-mono);font-size:10.5px;text-transform:uppercase;color:var(--ink-muted);background:var(--surface-alt);letter-spacing:.04em}
  tr:last-child td{border-bottom:none}
  .tablewrap{overflow-x:auto}
  .tabs{display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap}
  .tabs button{border:1px solid var(--rule-strong);background:var(--surface);border-radius:999px;padding:5px 13px;font-size:12.5px;font-weight:600;cursor:pointer;font-family:var(--font-mono);color:var(--ink-muted)}
  .tabs button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
  .Notice{border-left:4px solid var(--amber);background:var(--amber-soft);border-radius:10px;padding:12px 14px}
  .actbtn{width:100%;text-align:center;border:1px solid var(--rule-strong);background:var(--surface);border-radius:12px;padding:13px;font-weight:600;font-size:14.5px;cursor:pointer;color:var(--ink);transition:all 120ms;font-family:inherit}
  .actbtn:hover{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
  .actbtn:active{transform:translateY(1px)}
  .actbtn.inert{cursor:not-allowed;opacity:.55}
  input.field,select.field{padding:9px 11px;border:1px solid var(--rule-strong);border-radius:9px;font-size:14px;font-family:inherit}
  .tl{display:flex;flex-direction:column;gap:8px;margin-top:4px}
  .tl .r{display:flex;gap:10px;align-items:flex-start;font-size:13.5px}
  .tl .s{color:var(--accent);font-size:10px;margin-top:5px}
  .md-h{font-weight:700;color:var(--ink);margin:12px 0 4px}
  .md-p{margin:6px 0;line-height:1.6}
  .md-ul{margin:6px 0 6px 4px;padding-left:18px}
  .md-ul li{margin:3px 0;line-height:1.55}
  /* KanbanBoard */
  .kb{background:var(--surface);border:1px solid var(--rule);border-radius:12px;padding:14px;overflow-x:auto}
  .kb .kbt{font-size:11.5px;font-weight:600;color:var(--ink-muted);margin-bottom:10px;font-family:var(--font-mono);text-transform:uppercase;letter-spacing:.04em}
  .kb .lanes{display:flex;gap:12px;align-items:flex-start;min-width:min-content}
  .kb .lane{flex:1 0 175px;min-width:175px;background:var(--surface-alt);border:1px solid var(--rule);border-radius:10px;padding:10px}
  .kb .lh{display:flex;align-items:center;gap:6px;margin-bottom:8px}
  .kb .ln{font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--ink)}
  .kb .lc{margin-left:auto;font-family:var(--font-mono);font-size:10.5px;color:var(--ink-muted);background:var(--surface);border:1px solid var(--rule);border-radius:999px;padding:1px 7px}
  .kb .lc.over{color:var(--red-ink);border-color:var(--red)}
  .kb .card{background:var(--surface);border:1px solid var(--rule);border-left:3px solid var(--accent);border-radius:8px;padding:8px 10px;margin-bottom:7px;font-size:13px;transition:all 120ms}
  .kb .card.good{border-left-color:var(--green)}.kb .card.warn{border-left-color:var(--amber)}.kb .card.bad{border-left-color:var(--red)}
  .kb .card .ct{font-weight:600;color:var(--ink);line-height:1.35}
  .kb .card .cm{font-size:10.5px;color:var(--ink-muted);margin-top:3px;font-family:var(--font-mono)}
  .kb button.card{display:block;width:100%;text-align:left;cursor:pointer;font-family:inherit}
  .kb button.card:hover{border-color:var(--accent);background:var(--accent-soft)}
  .kb .empty{font-size:10.5px;color:var(--ink-muted);font-style:italic;padding:4px 2px;text-align:left}
</style>
</head>
<body>
<div class="wrap">
  <div class="head">
    <h1>Career Pipeline</h1>
    <span class="sub">every answer is a composed interface · never a paragraph</span>
  </div>
  <div class="rule"></div>

  <div class="starters" id="starters"></div>
  <div class="startbar">
    <input id="prompt" value="Track my job hunt. I have six applications out for senior backend engineer roles — a couple just submitted, two in interview loops, one at offer stage and one rejected. Show me where each application currently stands." />
    <button id="ask">Ask</button>
  </div>
  <div class="status" id="status"></div>
  <div class="screen"><div id="mount"><div class="empty">Ask something about your job hunt. Every reply is a live interface the agent composes — tap anything in it to go deeper.</div></div></div>
  <div id="refused"></div>
  <div class="crumbs" id="crumbs"></div>
</div>

<script>
// =========================================================================
// The Career Pipeline app shell.
//
// It holds NO domain logic and NO templates. It sends a goal to the runtime,
// reads back a catalog-validated component tree, and draws it. Every turn is a
// composed interface; a tap is the only thing that earns the next turn.
//
// The render engine maps trusted catalog types to DOM. It NEVER assigns
// innerHTML and NEVER evaluates a string, so no value the model produced can
// become code. Unknown types are skipped with a visible marker, not executed.
// =========================================================================
const API = "";                     // same origin as the runtime
let convo = [];                     // [opening goal, tap, tap, ...]

// Mirrors catalog.REGISTERED_ACTIONS. A tap is wired only for these names.
const REGISTERED_ACTIONS = new Set(["approve","reject","rerun","request_data"]);

const STARTERS = [
  "Track my job hunt. I have six applications out for senior backend engineer roles — a couple just submitted, two in interview loops, one at offer stage and one rejected. Show me where each application currently stands.",
  "Break down how my interview performance has trended over my last six onsite loops.",
  "Compare the three offers I am weighing on compensation, growth and risk.",
];

const $ = (t,c)=>{const e=document.createElement(t);if(c)e.className=c;return e;};
const T = t=>document.createTextNode(t==null?"":String(t));
const resolve=(v,dm)=>(v&&typeof v==="object"&&"$bind"in v)?ptr(dm,v["$bind"]):v;
function ptr(dm,p){let c=dm;for(const s of String(p).split("/").slice(1)){if(c==null)return null;c=c[s];}return c;}
// An Image src is used only if its scheme is not javascript:/data:/vbscript:.
function isSafeUrl(u){return typeof u==="string"&&!/^\s*(javascript|data|vbscript):/i.test(u);}

// ---- safe markdown: model text becomes DOM via createElement + text nodes.
// Never innerHTML, so any HTML or script in the text stays literal characters.
function mdInline(line,parent){
  const re=/(\*\*([^*]+)\*\*|\*([^*]+)\*|_([^_]+)_)/g;let last=0,m;
  while((m=re.exec(line))){
    if(m.index>last)parent.append(T(line.slice(last,m.index)));
    if(m[2]!=null){const s=document.createElement("strong");s.textContent=m[2];parent.append(s);}
    else{const e=document.createElement("em");e.textContent=(m[3]!=null?m[3]:m[4]);parent.append(e);}
    last=re.lastIndex;
  }
  if(last<line.length)parent.append(T(line.slice(last)));
}
function md(text){
  const frag=document.createDocumentFragment();let ul=null;
  for(const raw of String(text==null?"":text).split(/\r?\n/)){
    const line=raw.trim();if(!line){ul=null;continue;}
    const h=line.match(/^(#{1,4})\s+(.*)/),b=line.match(/^[*\-]\s+(.*)/);
    if(h){ul=null;const d=$("div","md-h");mdInline(h[2],d);frag.append(d);}
    else if(b){if(!ul){ul=document.createElement("ul");ul.className="md-ul";frag.append(ul);}const li=document.createElement("li");mdInline(b[1],li);ul.append(li);}
    else{ul=null;const p=$("div","md-p");mdInline(line,p);frag.append(p);}
  }
  return frag;
}

const R={
  Column:(c,x)=>{const e=$("div","Column");kids(c,x,e);return e;},
  Row:(c,x)=>{const e=$("div","Row");kids(c,x,e);return e;},
  List:(c,x)=>{const e=$("div","List");kids(c,x,e);return e;},
  Card:(c,x)=>{const e=$("div","Card");if(c.title){const h=$("div","ct");h.append(T(c.title));e.append(h);}kids(c,x,e);return e;},
  Divider:()=>$("div","Divider"),
  Text:(c,x)=>{const e=$("div","Text "+(c.variant||"body"));const v=resolve(c.text,x.dm);
    if((c.variant||"body")==="heading"){e.append(T(v));}else{e.append(md(v));}return e;},
  Notice:(c,x)=>{const e=$("div","Notice");e.append(T(resolve(c.text,x.dm)));return e;},
  Image:(c)=>{const e=$("img");if(isSafeUrl(c.src))e.setAttribute("src",c.src);e.setAttribute("alt",c.alt==null?"":String(c.alt));e.style.cssText="max-width:100%;border-radius:8px";return e;},
  StatTile:(c,x)=>{const e=$("div","StatTile "+(c.tone||"neutral"));
    const l=$("div","lab");l.append(T(c.label));
    const v=$("div","val");v.append(T(String(resolve(c.value,x.dm))+(c.unit?" "+c.unit:"")));
    const d=$("div","dl");d.append(T(resolve(c.delta,x.dm)||""));e.append(l,v,d);return e;},
  ProgressBar:(c,x)=>{const e=$("div","chart");const t=$("div","ct");t.append(T("progress"));
    const p=$("div","prog");const i=$("i");const val=+resolve(c.value,x.dm)||0;
    // max is declared "number", but a model often binds it to a pointer. Resolve
    // it the same way as any other value so the caption never shows an object.
    const max=+resolve(c.max,x.dm)||100;
    i.style.width=Math.min(100,val/max*100)+"%";p.append(i);
    const cap=$("div");cap.style.cssText="font-size:11px;color:var(--ink-muted);margin-top:6px;font-family:var(--font-mono)";
    cap.append(T(val+" / "+max));e.append(t,p,cap);return e;},
  Sparkline:(c,x)=>{const e=$("div","chart");const t=$("div","ct");t.append(T("trend"));e.append(t,spark(resolve(c.data,x.dm)||[],c.tone));return e;},
  BarChart:(c,x)=>{const e=$("div","chart");const t=$("div","ct");t.append(T(c.title||"chart"));e.append(t,bars(resolve(c.data,x.dm)||[],c.xKey,c.yKey));return e;},
  DataTable:(c,x)=>table(c,x),
  Tabs:(c,x)=>tabs(c,x),
  Timeline:(c,x)=>{const e=$("div","chart");const t=$("div","ct");t.append(T(c.title||"timeline"));
    const b=$("div","tl");(resolve(c.events,x.dm)||[]).forEach(ev=>{const r=$("div","r");
      const dot=$("span","s");dot.textContent="●";
      const lab=$("div");lab.style.flex="1";
      mdInline(String(ev.label!=null?ev.label:(ev.kind!=null?ev.kind:"")),lab);
      const tm=$("span");tm.style.cssText="font-family:var(--font-mono);font-size:11px;color:var(--ink-muted)";
      tm.append(T(ev.time!=null?ev.time:(ev.seq!=null?ev.seq:"")));
      r.append(dot,lab,tm);b.append(r);});
    e.append(t,b);return e;},
  Button:(c,x)=>{const b=$("button","actbtn");
    let lab=resolve(c.label,x.dm);
    if(lab&&typeof lab==="object")lab=lab.label||lab.name||lab.text||lab.id||"Choose";
    lab=String(lab==null?"Choose":lab);b.append(T(lab));
    // The event invariant at render time: only a registered action is wired.
    const act=c.onPress&&c.onPress.action;
    if(REGISTERED_ACTIONS.has(act)||act==null){b.onclick=()=>choose(lab);}
    else{b.classList.add("inert");b.title="unregistered action refused";}
    return b;},
  TextField:(c)=>{const w=$("div");if(c.label){const l=$("div","lab");l.append(T(c.label));w.append(l);}
    const i=$("input","field");i.placeholder=c.placeholder||"";w.append(i);return w;},
  CheckBox:(c)=>{const w=$("label");w.style.cssText="display:flex;gap:8px;align-items:center";
    const i=document.createElement("input");i.type="checkbox";w.append(i,T(c.label||""));return w;},
  Slider:(c)=>{const w=$("div");if(c.label){const l=$("div","lab");l.append(T(c.label));w.append(l);}
    const i=document.createElement("input");i.type="range";i.min=c.min||0;i.max=c.max||100;w.append(i);return w;},
  InputChoice:(c,x)=>{const s=$("select","field");(resolve(c.options,x.dm)||[]).forEach(o=>{
    const op=document.createElement("option");op.append(T(typeof o==="object"?(o.name||o.label||o.id):o));s.append(op);});return s;},
  DateTime:()=>{const i=$("input","field");i.type="date";return i;},
  Modal:(c,x)=>{const e=$("div","Card");if(c.title){const h=$("div","ct");h.append(T(c.title));e.append(h);}kids(c,x,e);return e;},
  ApprovalCard:(c,x)=>{const e=$("div","Card");const s=$("div","ct");s.append(T(resolve(c.summary,x.dm)||"Approve?"));
    const pre=document.createElement("pre");pre.style.cssText="font-size:12px;background:var(--surface-alt);padding:8px;border-radius:8px;overflow:auto";
    pre.append(T(JSON.stringify(resolve(c.params,x.dm),null,2)));
    const ok=$("button","actbtn");ok.append(T("Approve"));ok.onclick=()=>choose("approve");
    e.append(s,pre,ok);return e;},

  // The contributed component. Lanes of cards; every string is a text node, so
  // a card titled "<img onerror=...>" shows those literal characters. A card is
  // tappable only when onCardPress names a REGISTERED action, and tapping feeds
  // the card title back as the next turn.
  KanbanBoard:(c,x)=>{
    const e=$("div","kb");const t=$("div","kbt");t.append(T(c.title||"board"));e.append(t);
    const lanes=$("div","lanes");
    const wipRaw=resolve(c.wipLimit,x.dm);const wip=(wipRaw==null||wipRaw==="")?null:(+wipRaw||null);
    const act=c.onCardPress&&c.onCardPress.action;
    const tappable=REGISTERED_ACTIONS.has(act);
    (resolve(c.columns,x.dm)||[]).forEach(col=>{
      const lane=$("div","lane");const head=$("div","lh");
      const nm=$("div","ln");nm.append(T(col&&col.title!=null?col.title:""));
      const cards=(col&&col.cards)||[];
      const ct=$("span","lc"+((wip!=null&&cards.length>wip)?" over":""));
      ct.append(T(wip!=null?(cards.length+"/"+wip):String(cards.length)));
      head.append(nm,ct);lane.append(head);
      if(!cards.length){const em=$("div","empty");em.append(T("empty"));lane.append(em);}
      cards.forEach(card=>{
        const tone=({good:"good",warn:"warn",bad:"bad"})[card&&card.tone]||"";
        const box=$(tappable?"button":"div","card "+tone);
        const ti=$("div","ct");ti.append(T(card&&card.title!=null?card.title:""));box.append(ti);
        if(card&&card.meta!=null&&String(card.meta)!==""){const mt=$("div","cm");mt.append(T(card.meta));box.append(mt);}
        if(tappable){box.type="button";box.onclick=()=>choose(String(card&&card.title!=null?card.title:""));}
        lane.append(box);
      });
      lanes.append(lane);
    });
    e.append(lanes);return e;
  },
};

function kids(c,x,e){for(const id of (c.children||[])){const ch=x.byId[id];if(ch)e.append(node(ch,x));}}
function node(c,x){const f=R[c.type];
  if(!f){const s=$("div");s.style.cssText="color:var(--red-ink);font-family:var(--font-mono);font-size:11px";
    s.append(T("[skipped unknown type: "+c.type+"]"));return s;}
  return f(c,x);}

function spark(v,tone){const ns="http://www.w3.org/2000/svg",w=200,h=44,mx=Math.max(...v,1),mn=Math.min(...v,0),rg=(mx-mn)||1;
  const col=({good:"var(--green)",warn:"var(--amber)",bad:"var(--red)"}[tone]||"var(--accent)");
  const s=document.createElementNS(ns,"svg");s.setAttribute("viewBox",`0 0 ${w} ${h}`);s.setAttribute("width","100%");s.setAttribute("height",h);
  const p=document.createElementNS(ns,"polyline");
  p.setAttribute("points",v.map((y,i)=>`${i/(v.length-1||1)*w},${h-5-(y-mn)/rg*(h-10)}`).join(" "));
  p.setAttribute("fill","none");p.setAttribute("stroke",col);p.setAttribute("stroke-width","2.5");s.append(p);return s;}

function bars(d,xk,yk){const ns="http://www.w3.org/2000/svg",w=320,h=160,pad=26;
  const mx=Math.max(...d.map(r=>+r[yk]),1),bw=(w-pad*2)/(d.length||1)*.6;
  const s=document.createElementNS(ns,"svg");s.setAttribute("viewBox",`0 0 ${w} ${h}`);s.setAttribute("width","100%");
  d.forEach((r,i)=>{const x=pad+i*((w-pad*2)/d.length)+((w-pad*2)/d.length-bw)/2,bh=(+r[yk])/mx*(h-pad*2);
    const rc=document.createElementNS(ns,"rect");rc.setAttribute("x",x);rc.setAttribute("y",h-pad-bh);
    rc.setAttribute("width",bw);rc.setAttribute("height",bh);rc.setAttribute("rx",3);rc.setAttribute("fill","var(--accent)");s.append(rc);
    const tl=document.createElementNS(ns,"text");tl.setAttribute("x",x+bw/2);tl.setAttribute("y",h-9);
    tl.setAttribute("text-anchor","middle");tl.setAttribute("font-size","9");tl.setAttribute("fill","var(--ink-muted)");
    tl.textContent=r[xk];s.append(tl);});
  return s;}

function table(c,x){const wrap=$("div","tablewrap");
  let cols=(c.columns||"").split(",").map(s=>s.trim()).filter(Boolean);
  const rows=resolve(c.rows,x.dm)||[];
  if(!cols.length&&rows.length)cols=Object.keys(rows[0]);
  const t=$("table");const tr=$("tr");
  cols.forEach(col=>{const th=$("th");th.append(T(col));tr.append(th);});t.append(tr);
  rows.forEach(r=>{const rr=$("tr");cols.forEach(col=>{const td=$("td");td.append(T(r[col]));rr.append(td);});t.append(rr);});
  wrap.append(t);return wrap;}

function tabs(c,x){const wrap=$("div");const nav=$("div","tabs");const body=$("div");wrap.append(nav,body);
  const tabIds=c.children||[];
  function show(i){body.textContent="";const cc=x.byId[tabIds[i]];if(cc)body.append(node(cc,x));
    [...nav.children].forEach((b,j)=>b.classList.toggle("on",i===j));}
  (String(c.labels||"").split(",")).forEach((lab,i)=>{const b=$("button");b.append(T(lab.trim()||("tab "+(i+1))));b.onclick=()=>show(i);nav.append(b);});
  if(tabIds.length)show(0);return wrap;}

function render(surface){
  const byId={};surface.components.forEach(c=>byId[c.id]=c);
  const x={byId,dm:surface.dataModel||{}};
  const m=document.getElementById("mount");m.textContent="";
  const root=byId[surface.root]||surface.components[0];
  if(root)m.append(node(root,x));
}

// ---- status + refusals, built as DOM (the page never assigns innerHTML) ----
function setStatus(cls,pill,rest){
  const s=document.getElementById("status");s.textContent="";
  if(pill){const p=$("span","pill "+(cls||""));p.append(T(pill));s.append(p);}
  if(rest)s.append(T(rest));
}
function showRefusals(rejections){
  const box=document.getElementById("refused");box.textContent="";
  if(!rejections||!rejections.length)return;
  const d=$("div","refused");const h=document.createElement("h4");
  h.append(T("validator refused "+rejections.length+" component(s) — the rest still rendered"));
  const ul=document.createElement("ul");ul.style.margin="0";ul.style.paddingLeft="18px";
  rejections.forEach(r=>{const li=document.createElement("li");
    li.append(T("["+r.invariant+"] "+r.component_id+"."+r.field+" — "+r.reason));ul.append(li);});
  d.append(h,ul);box.append(d);
}
function crumbs(){
  const c=document.getElementById("crumbs");c.textContent="";
  if(!convo.length)return;
  c.append(T("conversation: "+convo.map((s,i)=>i?"tap “"+s+"”":"“"+s.slice(0,60)+(s.length>60?"…":"")+"”").join("  ›  ")));
}

// ---- a tap becomes the next turn ----
// The opening goal stays as context, but the interface is composed for the MOST
// RECENT tap and told to go deeper rather than redraw the previous screen.
function goalFor(convo){
  if(convo.length===1)return convo[0];
  const last=convo[convo.length-1];
  const trail=convo.slice(1,-1);
  return ("Original goal: "+convo[0]+"\n"+
    (trail.length?("The user already drilled into: "+trail.join(", then ")+".\n"):"")+
    "The user has now tapped: \""+last+"\".\n"+
    "Compose the interface that answers THAT tap specifically. Go one level deeper: if it names a single "+
    "item, show that one item's detail and history; if it asks to compare or analyse, show the comparison. "+
    "Do not simply redraw the previous screen.");
}

async function runTurn(userText){
  convo.push(userText);crumbs();
  showRefusals([]);
  setStatus("think","composing…"," the agent is writing an interface for: \""+userText+"\"");
  const started=Date.now();
  try{
    const res=await fetch(API+"/v1/agent/runs",{method:"POST",headers:{"Content-Type":"application/json"},
      body:JSON.stringify({prompt:goalFor(convo),respond_as:"ui",tenant_id:"course",project_id:"s14",
                           user_id:"viewer-synthetic",agent_id:"jobhunt"})});
    const run=await res.json();
    const c=await (await fetch(API+"/v1/runs/"+run.run_id+"/composed")).json();
    const secs=((Date.now()-started)/1000).toFixed(1);
    if(c.surface&&c.surface.components&&c.surface.components.length){
      render(c.surface);
      const types=[...new Set(c.surface.components.map(k=>k.type))];
      setStatus(c.clean?"good":"bad",
        (c.provider||"gemini")+" · "+c.component_count+" components · 0 executable",
        " · "+secs+"s · "+types.join(", "));
    } else {
      // The composer can return an unparseable or empty tree (usually a reply
      // truncated by the surface token budget). Say so honestly and offer the
      // turn again rather than leaving a stale screen with no explanation.
      setStatus("bad","no interface"," the agent composed nothing renderable for this turn");
      const m=document.getElementById("mount");m.textContent="";
      const n=$("div","Notice");
      n.append(T("The agent did not return a renderable interface for “"+userText+"”. "+
                 "Nothing was invented to fill the gap."));
      const again=$("button","actbtn");again.append(T("Try this turn again"));
      again.onclick=()=>{convo.pop();runTurn(userText);};
      const col=$("div","Column");col.append(n,again);m.append(col);
    }
    // Fetch the run journal for the validator's own rejection list.
    const j=await (await fetch(API+"/v1/agent/runs/"+run.run_id)).json();
    const v=(((j.nodes||{}).surface||{}).result||{}).validator||{};
    showRefusals(v.rejections);
  }catch(err){
    setStatus("bad","error"," "+String(err&&err.message?err.message:err));
  }
}
function choose(label){if(label)runTurn(label);}

const sb=document.getElementById("starters");
STARTERS.forEach(s=>{const b=$("button");b.append(T(s.length>52?s.slice(0,52)+"…":s));
  b.title=s;b.onclick=()=>{document.getElementById("prompt").value=s;convo=[];runTurn(s);};sb.append(b);});

document.getElementById("ask").onclick=()=>{convo=[];runTurn(document.getElementById("prompt").value.trim());};
document.getElementById("prompt").addEventListener("keydown",e=>{if(e.key==="Enter")document.getElementById("ask").click();});
</script>
