<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>S14 app — the agent answers in UI</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap">
<style>
  :root{
    --bg:#F7F8FA;--surface:#FFF;--surface-alt:#FAFAFA;--ink:#111;--ink-body:#1A1A1A;--ink-muted:#555;
    --rule:#E8E8E8;--rule-strong:#D0D0D0;--accent:#2563EB;--accent-soft:rgba(37,99,235,.08);
    --green:#16A34A;--green-soft:rgba(22,163,74,.12);--green-ink:#15803D;
    --amber:#D97706;--amber-soft:rgba(217,119,6,.14);--amber-ink:#B45309;
    --red:#DC2626;--red-soft:rgba(220,38,38,.10);--red-ink:#B91C1C;
    --font-sans:'Inter',system-ui,sans-serif;--font-serif:'Palatino Linotype',Palatino,Georgia,serif;--font-mono:'JetBrains Mono',ui-monospace,Menlo,monospace;
  }
  *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink-body);font-family:var(--font-sans);font-size:15px}
  .wrap{max-width:720px;margin:0 auto;padding:22px 18px 60px}
  .head{display:flex;gap:8px;align-items:center;margin-bottom:6px;font-family:var(--font-mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-muted)}
  .head a{color:var(--accent);text-decoration:none}
  .head a:hover{text-decoration:underline}
  .startbar{display:flex;gap:8px;margin:10px 0 10px}
  .startbar input{flex:1;padding:11px 14px;border:1px solid var(--rule-strong);border-radius:10px;font-size:15px;font-family:var(--font-sans)}
  .startbar input:focus{outline:none;border-color:var(--accent)}
  .startbar button{padding:11px 18px;border:none;border-radius:10px;background:var(--ink);color:#fff;font-weight:600;font-size:14px;cursor:pointer}
  .stepperbar{display:flex;gap:8px;align-items:center;margin:0 0 18px;font-family:var(--font-mono);font-size:12px;color:var(--ink-muted)}
  .stepperbar select{padding:8px 10px;border:1px solid var(--rule-strong);border-radius:9px;font-size:13px;font-family:var(--font-sans);background:var(--surface);color:var(--ink-body);flex:1}
  .stepperbar select:focus{outline:none;border-color:var(--accent)}
  .status{font-family:var(--font-mono);font-size:12px;color:var(--ink-muted);min-height:18px;margin-bottom:10px;display:flex;gap:8px;align-items:center}
  .pill{padding:2px 9px;border-radius:999px;font-weight:600;font-size:11px}
  .pill.good{background:var(--green-soft);color:var(--green-ink)}.pill.think{background:var(--accent-soft);color:var(--accent)}
  .startbar input:disabled,.startbar button:disabled,.stepperbar select:disabled{opacity:.55;cursor:not-allowed}
  .elapsed{font-variant-numeric:tabular-nums}
  .screen{background:var(--surface);border:1px solid var(--rule);border-radius:16px;padding:22px;box-shadow:0 4px 16px -8px rgba(0,20,60,.12);min-height:120px}
  .empty{color:var(--ink-muted);font-style:italic;text-align:center;padding:30px 0}
  .crumbs{font-family:var(--font-mono);font-size:11px;color:var(--ink-muted);margin-top:12px}
  /* component styles (mirror the S14 render client) */
  .Text{color:var(--ink-body);line-height:1.6;white-space:pre-wrap;margin:2px 0}
  .Text.heading{font-family:var(--font-serif);font-size:26px;font-weight:700;color:var(--ink);white-space:normal;margin:0 0 6px}
  .Text.subtitle{font-style:italic;color:var(--ink-muted);font-size:16px}
  .Text.caption{font-size:12px;color:var(--ink-muted);font-family:var(--font-mono)}
  .Column{display:flex;flex-direction:column;gap:14px}
  .List{display:flex;flex-direction:column;gap:10px}
  .Row{display:flex;gap:12px;align-items:stretch;flex-wrap:wrap}
  .Row>.StatTile,.Row>.chart{flex:1;min-width:120px}
  .Card{background:var(--surface-alt);border:1px solid var(--rule);border-radius:12px;padding:14px 16px}
  .Card>.ct{font-weight:600;margin-bottom:8px}
  .Divider{height:1px;background:var(--rule)}
  .StatTile{background:var(--surface);border:1px solid var(--rule);border-top:3px solid var(--accent);border-radius:12px;padding:14px}
  .StatTile .lab{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-muted);font-weight:600;font-family:var(--font-mono)}
  .StatTile .val{font-size:28px;font-weight:700;color:var(--ink);margin-top:5px}
  .StatTile .dl{font-size:11px;color:var(--ink-muted);margin-top:3px}
  .chart{background:var(--surface);border:1px solid var(--rule);border-radius:12px;padding:14px}
  .chart .ct{font-size:12px;font-weight:600;color:var(--ink-muted);margin-bottom:8px;font-family:var(--font-mono)}
  .prog{height:12px;border-radius:999px;background:var(--surface-alt);border:1px solid var(--rule);overflow:hidden}.prog>i{display:block;height:100%;background:var(--green)}
  table{width:100%;border-collapse:collapse;background:var(--surface);border:1px solid var(--rule);border-radius:12px;overflow:hidden}
  th,td{text-align:left;padding:9px 12px;border-bottom:1px solid var(--rule);font-size:14px}
  th{font-family:var(--font-mono);font-size:11px;text-transform:uppercase;color:var(--ink-muted);background:var(--surface-alt)}
  tr:last-child td{border-bottom:none}
  .tabs{display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap}
  .tabs button{border:1px solid var(--rule-strong);background:var(--surface);border-radius:999px;padding:5px 13px;font-size:13px;font-weight:600;cursor:pointer;font-family:var(--font-mono);color:var(--ink-muted)}
  .tabs button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
  .Notice{border-left:4px solid var(--amber);background:var(--amber-soft);border-radius:10px;padding:12px 14px}
  /* Stepper: a one-step-at-a-time wizard (progress dots + the current step's
     detail + Back/Next/Ask-a-follow-up), not an all-steps-flattened list —
     the same pattern a trainer app would use for a real procedure. */
  .Stepper{background:var(--surface);border:1px solid var(--rule);border-radius:12px;padding:18px}
  .st-head-title{font-weight:700;font-size:16px;color:var(--ink)}
  .st-head-sub{font-size:12px;color:var(--ink-muted);margin-top:2px;font-family:var(--font-mono)}
  .st-dots{display:flex;align-items:center;margin:16px 0}
  .st-dot{width:28px;height:28px;min-width:28px;border-radius:50%;background:var(--surface);border:2px solid var(--rule-strong);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;font-family:var(--font-mono);color:var(--ink-muted);cursor:pointer;flex-shrink:0}
  .st-dot:hover{border-color:var(--accent)}
  .st-dot.done{border-color:var(--green);background:var(--green);color:#fff}
  .st-dot.current{border-color:var(--accent);background:var(--accent);color:#fff}
  .st-line{flex:1;height:2px;background:var(--rule-strong);margin:0 2px}
  .st-line.done{background:var(--green)}
  .st-detail{background:var(--surface-alt);border-radius:10px;padding:14px 16px;margin-bottom:16px}
  .st-detail-title{font-weight:700;color:var(--ink);margin-bottom:6px}
  .st-detail-body{color:var(--ink-body);line-height:1.6}
  .st-foot{display:flex;align-items:center;gap:10px}
  .st-navbtn{border:1px solid var(--rule-strong);background:var(--surface);border-radius:9px;padding:9px 16px;font-weight:600;font-size:13px;cursor:pointer;color:var(--ink);font-family:var(--font-sans)}
  .st-navbtn:hover{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
  .st-navbtn:disabled{opacity:.4;cursor:not-allowed;border-color:var(--rule-strong);color:var(--ink);background:var(--surface)}
  .st-count{flex:1;text-align:center;font-family:var(--font-mono);font-size:12px;color:var(--ink-muted)}
  /* run chrome: badges (composed-by + run id), live graph breadcrumb, process timeline */
  .badges{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:0 0 6px}
  .badges .sub{font-family:var(--font-mono);font-size:11px;color:var(--ink-muted)}
  .badges .runid{margin-left:auto;font-family:var(--font-mono);font-size:11px;color:var(--ink-muted)}
  .hint{font-family:var(--font-mono);font-size:11px;color:var(--ink-muted);margin-bottom:10px}
  .graphpath{font-family:var(--font-mono);font-size:11px;color:var(--ink-muted);margin:0 0 14px;display:flex;flex-wrap:wrap;gap:4px;align-items:center}
  .graphpath .chip{background:var(--surface);border:1px solid var(--rule);border-radius:999px;padding:2px 9px;color:var(--ink-body)}
  .graphpath .sep{color:var(--rule-strong)}
  .tl{background:#0f1117;border-radius:12px;padding:12px 14px;font-family:var(--font-mono);font-size:12px;color:#c8d0e0;max-height:220px;overflow:auto;margin-top:16px}
  .tl .hd{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:#6b7594;margin-bottom:8px}
  .tl .r{display:flex;gap:10px;padding:2px 0}.tl .s{color:#6b7594}.tl .k{color:#4ade80}.tl .n{color:#c8d0e0}
  .actbtn{width:100%;text-align:center;border:1px solid var(--rule-strong);background:var(--surface);border-radius:12px;padding:14px;font-weight:600;font-size:15px;cursor:pointer;color:var(--ink);transition:all 120ms}
  .actbtn:hover{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
  .actbtn:active{transform:translateY(1px)}
  input.field,select.field{padding:9px 11px;border:1px solid var(--rule-strong);border-radius:9px;font-size:14px;font-family:var(--font-sans)}
  /* safe markdown (built as DOM, never innerHTML) */
  .Text .md-h{font-weight:700;color:var(--ink);margin:12px 0 4px}
  .Text .md-p{margin:6px 0;line-height:1.6}
  .Text .md-ul{margin:6px 0 6px 4px;padding-left:18px}
  .Text .md-ul li{margin:3px 0;line-height:1.55}
</style>
</head>
<body>
<div class="wrap">
  <div class="head"><span>S14 app · the agent answers in UI</span><a id="stepperLink" href="/s/stepper" target="_blank" rel="noopener" style="margin-left:auto">captured Stepper proof (flat tire) →</a></div>
  <div class="startbar">
    <input id="prompt" value="Teach me battery management system" />
    <button id="ask">Ask</button>
  </div>
  <div class="stepperbar">
    <span>topics</span>
    <select id="stepperTopics">
      <option value="" selected disabled>pick an example or a query you've asked before…</option>
    </select>
  </div>
  <div class="status" id="status"></div>
  <div class="badges" id="badges"></div>
  <div class="hint" id="hint"></div>
  <div class="graphpath" id="graphpath"></div>
  <div class="screen"><div id="mount"><div class="empty">Type a topic and press Ask. The agent teaches it as a live interface, drilling one level deeper each time you pick a subtopic — five levels deep.</div></div></div>
  <div class="crumbs" id="crumbs"></div>
  <div class="tl" id="timeline" style="display:none"></div>
</div>
<script>
// ---- the render engine: maps trusted catalog types to DOM. It NEVER sets
// innerHTML from a bound value and NEVER evaluates any string. A component is
// data; a widget draws it. Buttons feed the next turn; that is the only way the
// interface changes the world. ----
const API = "";                     // same origin as the runtime (8113)
let convo = [];                     // the running conversation (context for each turn)
const $ = (t,c)=>{const e=document.createElement(t);if(c)e.className=c;return e;};
const T = t=>document.createTextNode(t==null?"":String(t));
const resolve=(v,dm)=>(v&&typeof v==="object"&&"$bind"in v)?ptr(dm,v["$bind"]):v;
function ptr(dm,p){let c=dm;for(const s of String(p).split("/").slice(1)){if(c==null)return null;c=c[s];}return c;}
// The catalog's "text" kind means "a literal string", but the validator only
// enforces the {"$bind":...} SHAPE for "binding"-kind props — a "text" prop
// is still legal if the model binds it anyway (it isn't markup, so it passes
// data-not-code clean). Every literal-text read goes through this so a
// binding there resolves to its real value instead of stringifying to
// "[object Object]".
function rtext(v,dm){
  const r=resolve(v,dm);
  if(r&&typeof r==="object")return r.label||r.name||r.text||r.title||r.id||"";
  return r;
}

// ---- safe markdown: parse the model's text into DOM (createElement + text nodes).
// It NEVER uses innerHTML, so any HTML/script in the text stays literal text. ----
function mdInline(line,parent){
  const re=/(\*\*([^*]+)\*\*|\*([^*]+)\*|_([^_]+)_)/g;let last=0,m;
  while((m=re.exec(line))){
    if(m.index>last)parent.append(T(line.slice(last,m.index)));
    if(m[2]!=null){const s=document.createElement("strong");s.textContent=m[2];parent.append(s);}
    else{const e=document.createElement("em");e.textContent=(m[3]!=null?m[3]:m[4]);parent.append(e);}
    last=re.lastIndex;
  }
  if(last<line.length)parent.append(T(line.slice(last)));
}
function md(text){
  const frag=document.createDocumentFragment();let ul=null;
  for(const raw of String(text==null?"":text).split(/\r?\n/)){
    const line=raw.trim();if(!line){ul=null;continue;}
    const h=line.match(/^(#{1,4})\s+(.*)/),b=line.match(/^[*\-]\s+(.*)/);
    if(h){ul=null;const d=$("div","md-h");mdInline(h[2],d);frag.append(d);}
    else if(b){if(!ul){ul=document.createElement("ul");ul.className="md-ul";frag.append(ul);}const li=document.createElement("li");mdInline(b[1],li);ul.append(li);}
    else{ul=null;const p=$("div","md-p");mdInline(line,p);frag.append(p);}
  }
  return frag;
}

const R={
  Column:(c,x)=>{const e=$("div","Column");kids(c,x,e);return e;},
  Row:(c,x)=>{const e=$("div","Row");kids(c,x,e);return e;},
  List:(c,x)=>{const e=$("div","List");kids(c,x,e);return e;},
  Card:(c,x)=>{const e=$("div","Card");const title=rtext(c.title,x.dm);if(title){const h=$("div","ct");h.append(T(title));e.append(h);}kids(c,x,e);return e;},
  Divider:()=>$("div","Divider"),
  Text:(c,x)=>{const e=$("div","Text "+(c.variant||"body"));const v=resolve(c.text,x.dm);
    if((c.variant||"body")==="heading"){e.append(T(v));}else{e.append(md(v));}return e;},
  Notice:(c,x)=>{const e=$("div","Notice");e.append(T(resolve(c.text,x.dm)));return e;},
  StatTile:(c,x)=>{const e=$("div","StatTile");const l=$("div","lab");l.append(T(rtext(c.label,x.dm)));const unit=rtext(c.unit,x.dm);const v=$("div","val");v.append(T(String(resolve(c.value,x.dm))+(unit?" "+unit:"")));const d=$("div","dl");d.append(T(resolve(c.delta,x.dm)||""));e.append(l,v,d);return e;},
  Timeline:(c,x)=>{const e=$("div","chart");const t=$("div","ct");t.append(T(rtext(c.title,x.dm)||"timeline"));const b=$("div");b.style.cssText="display:flex;flex-direction:column;gap:8px;margin-top:4px";(resolve(c.events,x.dm)||[]).forEach(ev=>{const r=$("div");r.style.cssText="display:flex;gap:10px;align-items:flex-start;font-size:14px";const dot=$("span");dot.textContent="●";dot.style.cssText="color:var(--accent);font-size:10px;margin-top:5px";const lab=$("div");lab.style.flex="1";mdInline(String(ev.label!=null?ev.label:(ev.kind!=null?ev.kind:JSON.stringify(ev))),lab);r.append(dot,lab);b.append(r);});e.append(t,b);return e;},
  ProgressBar:(c,x)=>{const e=$("div","chart");const t=$("div","ct");t.append(T("progress"));const p=$("div","prog");const i=$("i");const val=+resolve(c.value,x.dm)||0;i.style.width=Math.min(100,val/(c.max||100)*100)+"%";p.append(i);e.append(t,p);return e;},
  Sparkline:(c,x)=>{const e=$("div","chart");const t=$("div","ct");t.append(T("trend"));e.append(t,spark(resolve(c.data,x.dm)||[]));return e;},
  BarChart:(c,x)=>{const e=$("div","chart");const t=$("div","ct");t.append(T(rtext(c.title,x.dm)||"chart"));e.append(t,bars(resolve(c.data,x.dm)||[],rtext(c.xKey,x.dm),rtext(c.yKey,x.dm)));return e;},
  DataTable:(c,x)=>table(c,x),
  Tabs:(c,x)=>tabs(c,x),
  Button:(c,x)=>{const b=$("button","actbtn");const lab=String(rtext(c.label,x.dm)||"Choose");b.append(T(lab));b.onclick=()=>choose(lab);return b;},
  Image:(c,x)=>{const e=$("div","chart");e.append(T("[image]"));return e;},
  TextField:(c,x)=>{const w=$("div");const label=rtext(c.label,x.dm);if(label){const l=$("div","lab");l.append(T(label));w.append(l);}const i=$("input","field");i.placeholder=rtext(c.placeholder,x.dm)||"";w.append(i);return w;},
  CheckBox:(c,x)=>{const w=$("label");w.style.display="flex";w.style.gap="8px";const i=document.createElement("input");i.type="checkbox";w.append(i,T(rtext(c.label,x.dm)||""));return w;},
  Slider:(c,x)=>{const w=$("div");const label=rtext(c.label,x.dm);if(label){const l=$("div","lab");l.append(T(label));w.append(l);}const i=document.createElement("input");i.type="range";i.min=c.min||0;i.max=c.max||100;w.append(i);return w;},
  InputChoice:(c,x)=>{const s=$("select","field");(resolve(c.options,x.dm)||[]).forEach(o=>{const op=document.createElement("option");op.append(T(typeof o==="object"?(o.name||o.label||o.id):o));s.append(op);});return s;},
  DateTime:(c,x)=>{const i=$("input","field");i.type="date";return i;},
  Modal:(c,x)=>{const e=$("div","Card");const title=rtext(c.title,x.dm);if(title){const h=$("div","ct");h.append(T(title));e.append(h);}kids(c,x,e);return e;},
  ApprovalCard:(c,x)=>{const e=$("div","Card");const s=$("div","ct");s.append(T(resolve(c.summary,x.dm)||"Approve?"));const pre=document.createElement("pre");pre.style.cssText="font-size:12px;background:var(--surface-alt);padding:8px;border-radius:8px;overflow:auto";pre.append(T(JSON.stringify(resolve(c.params,x.dm),null,2)));const ok=$("button","actbtn");ok.append(T("Approve"));ok.onclick=()=>choose("approve");e.append(s,pre,ok);return e;},
  // A one-step-at-a-time wizard: progress dots (done/current/upcoming), the
  // current step's own title+detail, and Back / Next / "Ask a follow-up".
  // Paging between already-bound steps is pure client-local state (an `idx`
  // closure var, same pattern Tabs already uses) — no new model call, no
  // eval, nothing beyond re-drawing already-validated text into text nodes.
  // "Ask a follow-up" is the ONE place this reaches back into the app: it
  // reuses the exact same choose()/next-turn path a Button already uses, and
  // only appears when the surface itself registered onSelect for this step.
  Stepper:(c,x)=>{
    const e=$("div","Stepper");
    const title=rtext(c.title,x.dm);
    const steps=resolve(c.steps,x.dm)||[];
    const lk=rtext(c.labelKey,x.dm)||"label", dk=rtext(c.detailKey,x.dm)||"detail";
    const N=steps.length;
    if(!N){e.append(T("no steps"));return e;}
    let idx=c.current==null?0:Math.max(0,Math.min(N-1,+c.current));

    const head=$("div");
    const headTitle=$("div","st-head-title");headTitle.append(T(title||"Steps"));head.append(headTitle);
    const headSub=$("div","st-head-sub");head.append(headSub);
    const dots=$("div","st-dots");
    const detail=$("div","st-detail");
    const foot=$("div","st-foot");
    const backBtn=$("button","st-navbtn");backBtn.type="button";backBtn.append(T("Back"));
    const count=$("div","st-count");
    const nextBtn=$("button","st-navbtn");nextBtn.type="button";
    foot.append(backBtn,count,nextBtn);
    e.append(head,dots,detail,foot);

    function info(i){
      const s=steps[i]||{};
      const label=stepField(s,lk,["label","heading","title","name","id"])||("Step "+(i+1));
      const detailText=stepField(s,dk,["detail","points","text","body"]);
      return {label:String(label),detailText:detailText?String(detailText):""};
    }
    function goTo(i){idx=Math.max(0,Math.min(N-1,i));draw();}
    function draw(){
      headSub.textContent="";headSub.append(T(N+(N===1?" step":" steps")));
      dots.textContent="";
      steps.forEach((s,i)=>{
        if(i>0){const line=$("span","st-line"+(i<=idx?" done":""));dots.append(line);}
        const dot=$("div","st-dot"+(i<idx?" done":i===idx?" current":""));
        dot.append(T(i<idx?"✓":String(i+1)));
        dot.onclick=()=>goTo(i);
        dots.append(dot);
      });
      const cur=info(idx);
      detail.textContent="";
      const dTitle=$("div","st-detail-title");dTitle.append(T("Step "+(idx+1)+": "+cur.label));detail.append(dTitle);
      if(cur.detailText){const dBody=$("div","st-detail-body");dBody.append(T(cur.detailText));detail.append(dBody);}
      backBtn.disabled=idx===0;
      backBtn.onclick=()=>goTo(idx-1);
      count.textContent="";count.append(T((idx+1)+" of "+N));
      nextBtn.textContent="";nextBtn.style.visibility="visible";nextBtn.disabled=false;
      if(idx<N-1){
        nextBtn.append(T("Next"));
        nextBtn.onclick=()=>goTo(idx+1);
      } else if(c.onSelect){
        nextBtn.append(T("Ask a follow-up ↗"));
        nextBtn.onclick=()=>choose(cur.label);
      } else {
        nextBtn.style.visibility="hidden";
      }
    }
    draw();
    return e;
  },
};
// Stepper helper: reads a named field off a step record, falling back through a
// list of common alternates (array values are joined into one line of text).
// It only ever reads plain values into text nodes — never innerHTML.
function stepField(s,key,fallbacks){
  const keys=[key,...fallbacks];
  for(const k of keys){
    if(s&&s[k]!=null){const v=s[k];return Array.isArray(v)?v.join(" · "):v;}
  }
  return "";
}
function kids(c,x,e){for(const id of (c.children||[])){const ch=x.byId[id];if(ch)e.append(node(ch,x));}}
function node(c,x){const f=R[c.type];if(!f){const s=$("div");s.style.cssText="color:var(--red-ink);font-family:var(--font-mono);font-size:11px";s.append(T("[skipped "+c.type+"]"));return s;}return f(c,x);}
function spark(v){const ns="http://www.w3.org/2000/svg",w=200,h=44,mx=Math.max(...v,1),mn=Math.min(...v,0),rg=(mx-mn)||1;const s=document.createElementNS(ns,"svg");s.setAttribute("viewBox",`0 0 ${w} ${h}`);s.setAttribute("width","100%");s.setAttribute("height",h);const p=document.createElementNS(ns,"polyline");p.setAttribute("points",v.map((y,i)=>`${i/(v.length-1||1)*w},${h-5-(y-mn)/rg*(h-10)}`).join(" "));p.setAttribute("fill","none");p.setAttribute("stroke","var(--green)");p.setAttribute("stroke-width","2.5");s.append(p);return s;}
function bars(d,xk,yk){const ns="http://www.w3.org/2000/svg",w=300,h=150,pad=24,mx=Math.max(...d.map(r=>+r[yk]),1),bw=(w-pad*2)/(d.length||1)*.6;const s=document.createElementNS(ns,"svg");s.setAttribute("viewBox",`0 0 ${w} ${h}`);s.setAttribute("width","100%");d.forEach((r,i)=>{const x=pad+i*((w-pad*2)/d.length)+((w-pad*2)/d.length-bw)/2,bh=(+r[yk])/mx*(h-pad*2);const rc=document.createElementNS(ns,"rect");rc.setAttribute("x",x);rc.setAttribute("y",h-pad-bh);rc.setAttribute("width",bw);rc.setAttribute("height",bh);rc.setAttribute("rx",3);rc.setAttribute("fill","var(--accent)");s.append(rc);const tl=document.createElementNS(ns,"text");tl.setAttribute("x",x+bw/2);tl.setAttribute("y",h-8);tl.setAttribute("text-anchor","middle");tl.setAttribute("font-size","9");tl.setAttribute("fill","var(--ink-muted)");tl.textContent=r[xk];s.append(tl);});return s;}
function table(c,x){const wrap=$("div");const cols=(rtext(c.columns,x.dm)||"").split(",").map(s=>s.trim());const rows=resolve(c.rows,x.dm)||[];const t=$("table");const tr=$("tr");cols.forEach(col=>{const th=$("th");th.append(T(col));tr.append(th);});t.append(tr);rows.forEach(r=>{const rr=$("tr");cols.forEach(col=>{const td=$("td");td.append(T(r[col]));rr.append(td);});t.append(rr);});wrap.append(t);return wrap;}
function tabs(c,x){const wrap=$("div");const nav=$("div","tabs");const body=$("div");wrap.append(nav,body);const tabIds=c.children||[];function show(i){body.textContent="";const cc=x.byId[tabIds[i]];if(cc)body.append(node(cc,x));[...nav.children].forEach((b,j)=>b.classList.toggle("on",i===j));}
  (String(rtext(c.labels,x.dm)||"").split(",")).forEach((lab,i)=>{const b=$("button");b.append(T(lab.trim()||("tab "+(i+1))));b.onclick=()=>show(i);nav.append(b);});
  if(tabIds.length)show(0);return wrap;}

// Defensive fallback: nothing in the catalog/validator guarantees the
// model's declared "root" id actually names one of the accepted components
// (a dangling root isn't one of the three invariants — it's not a type, a
// value, or an action). Rather than crash on an undefined node, render every
// already-VALIDATED component no other component claims as a child, wrapped
// in a plain Column — the same "show what's safe" spirit the validator
// already applies to individual poisoned components.
function resolveRoot(surface,byId){
  if(byId[surface.root])return byId[surface.root];
  const referenced=new Set();
  Object.values(byId).forEach(c=>(c.children||[]).forEach(id=>referenced.add(id)));
  const orphans=Object.keys(byId).filter(id=>!referenced.has(id));
  return {id:"_fallback_root",type:"Column",children:orphans.length?orphans:Object.keys(byId)};
}
function render(surface){const byId={};surface.components.forEach(c=>byId[c.id]=c);const x={byId,dm:surface.dataModel||{}};const m=document.getElementById("mount");m.textContent="";m.append(node(resolveRoot(surface,byId),x));}

// ---- the app loop: a tap becomes the next turn, drilling one level deeper
// each time — a fixed, domain-agnostic depth of MAX_DEPTH levels. Level 1 is
// the user's original topic; each subsequent level is whatever subtopic they
// picked from the previous interface's choices. The depth and "teach, then
// offer subtopics" instruction is added HERE, client-side, so the agent/
// planner/surface builder stay generic to any subject, not just this one. ----
const MAX_DEPTH = 5;
function setStatus(html){document.getElementById("status").innerHTML=html;}
function crumbs(){
  const el=document.getElementById("crumbs");
  if(!convo.length){ el.textContent=""; return; }
  el.textContent = "level "+convo.length+" of "+MAX_DEPTH+" · "+convo.join("  ›  ");
}

// Common formatting rules appended to every level's goal, so the model never
// leaks these meta-instructions into the visible title, and never invents its
// own "Level N" numbering in choice labels (this client already tracks depth).
const _RULES = "Give a short, clean title (a few words naming the subject matter, "
  + "never mentioning levels, drill-downs or these instructions). Any subtopic "
  + "choice you offer must be a short plain subtopic name only — no numbering, "
  + "no \"Level\" prefix, no meta-commentary.";

function buildGoal(){
  const depth = convo.length;               // 1-based: how deep this turn is
  const topic = convo[0];
  if (depth === 1) {
    return topic + "\n\nTeach this topic as a hierarchical drill-down lesson "
      + "of up to " + MAX_DEPTH + " levels. This is level 1 of " + MAX_DEPTH
      + ": give focused introductory teaching content for the topic overall, "
      + "then ask the user to pick a subtopic of it to go deeper into next. " + _RULES;
  }
  const path = convo.slice(1).join(" › ");
  const picked = convo[depth - 1];
  if (depth < MAX_DEPTH) {
    return topic + "\n\nThe user is drilling down a hierarchical lesson on this "
      + "topic. Levels picked so far: " + path + ". This is level " + depth
      + " of " + MAX_DEPTH + ". Teach focused content for \"" + picked
      + "\" in that context, then ask the user to pick a subtopic of \""
      + picked + "\" to go deeper into next. " + _RULES;
  }
  return topic + "\n\nThe user is drilling down a hierarchical lesson on this "
    + "topic. Levels picked so far: " + path + ". This is the FINAL level "
    + MAX_DEPTH + " of " + MAX_DEPTH + ". Teach complete, detailed content for "
    + "\"" + picked + "\" in that context. Do not ask the user to pick "
    + "anything further — this is the deepest level of the lesson. " + _RULES;
}

// Defensive cleanup in case the model still numbers a choice label itself.
function cleanLabel(label){
  return String(label == null ? "" : label).replace(/^\s*level\s*\d+\s*[:\-–]\s*/i, "").trim();
}

// ---- run chrome: badges (composed-by + run id), the live graph's own node
// path, and a console of the run's real events. All three read data the
// backend already exposes (GET /v1/agent/runs/{id}) — nothing here is
// simulated, and none of it changes how the surface itself is rendered. ----
function shortProvider(p){ return p ? String(p).replace(/_\d+$/,"") : ""; }
function clearChrome(){
  document.getElementById("badges").innerHTML="";
  document.getElementById("graphpath").textContent="";
  const tl=document.getElementById("timeline"); tl.innerHTML=""; tl.style.display="none";
}
function renderBadges(c, rid){
  const b=document.getElementById("badges"); b.innerHTML="";
  const good=$("span","pill good");
  good.append(T("composed by "+(c.provider||"gemini")+" inside the live graph · "+c.component_count+" components · 0 executable"));
  const sub=$("span","sub");
  sub.append(T("composed by "+(c.model||"model")+" · 0 model-authored code"));
  const rtag=$("span","runid");
  rtag.append(T("run "+rid));
  b.append(good, sub, rtag);
}
function graphGroups(nodes, events){
  // Execution order = the sequence nodes were actually started in, per the
  // run's own event tape (falls back to insertion order for anything the
  // tape didn't cover). Sibling nodes sharing a skill and a "prefix_N" id
  // pattern (parallel fan-out, e.g. search_1/2/3) collapse into one chip.
  const order=[], seen=new Set();
  (events||[]).forEach(e=>{ if(e.kind==="task_started" && e.node_id && nodes[e.node_id] && !seen.has(e.node_id)){ seen.add(e.node_id); order.push(e.node_id); } });
  Object.keys(nodes||{}).forEach(id=>{ if(!seen.has(id)){ seen.add(id); order.push(id); } });
  const groups=[];
  order.forEach(id=>{
    const node=nodes[id]; if(!node) return;
    const m=id.match(/^(.+)_(\d+)$/);
    const last=groups[groups.length-1];
    if(m && last && last.skill===node.skill && last.prefix===m[1]){ last.ids.push(id); last.nums.push(m[2]); }
    else groups.push({skill:node.skill, prefix:m?m[1]:id, ids:[id], nums:m?[m[2]]:[]});
  });
  return groups.map(g=>{
    // A parallel fan-out (search_1/2/3) is labeled by its id range — the ids are
    // what tell those siblings apart. A singleton is labeled by its skill — the
    // role it played — since a lone internal id like "surface" says less than
    // the skill that ran there ("compose_surface").
    const label = g.ids.length>1 ? g.prefix+"_"+g.nums.join("/") : (g.skill||g.ids[0]);
    const providers=[...new Set(g.ids.map(id=>shortProvider((nodes[id].result||{}).provider)).filter(Boolean))];
    return providers.length ? label+" ("+providers.join(",")+")" : label;
  });
}
function renderGraphPath(g){
  const el=document.getElementById("graphpath"); el.textContent="";
  if(!g || !g.nodes) return;
  const groups=graphGroups(g.nodes, g.events);
  if(!groups.length) return;
  el.append(T("graph"));
  groups.forEach(label=>{
    const sep=$("span","sep"); sep.append(T(" › ")); el.append(sep);
    const chip=$("span","chip"); chip.append(T(label)); el.append(chip);
  });
}
function renderTimeline(g){
  const el=document.getElementById("timeline"); el.innerHTML="";
  if(!g || !g.events || !g.events.length){ el.style.display="none"; return; }
  el.style.display="block";
  const hd=$("div","hd"); hd.append(T("Process Timeline")); el.append(hd);
  g.events.forEach(ev=>{
    const r=$("div","r");
    const s=$("span","s"); s.append(T(String(ev.sequence).padStart(2,"0")));
    const k=$("span","k"); k.append(T(ev.kind));
    const n=$("span","n"); n.append(T(ev.node_id||""));
    r.append(s,k,n); el.append(r);
  });
}

// ---- busy state: the run itself is one blocking request (content role, then
// compose_surface — genuinely two sequential live model calls the server runs
// before it can answer at all, typically several seconds each), so there is
// no real progress event to poll mid-flight. This shows the REAL two fixed
// stages every "ui" run goes through, timed against their typical durations,
// plus a live elapsed-seconds counter — honest about what's happening and
// how long it's taking, without pretending to know server-side progress it
// doesn't have. ----
const STAGES = [
  { at: 0, label: "writing content" },
  { at: 2, label: "composing interface from the catalog" },
];
function setBusy(busy){
  ["prompt","ask","stepperTopics"].forEach(id=>{ document.getElementById(id).disabled = busy; });
}
function startProgress(){
  const started = Date.now();
  let stageIdx = 0;
  const tick = () => {
    const elapsed = (Date.now() - started) / 1000;
    while(stageIdx < STAGES.length - 1 && elapsed >= STAGES[stageIdx + 1].at) stageIdx++;
    setStatus('<span class="pill think">'+STAGES[stageIdx].label+'…</span>'
      +'<span class="elapsed">'+elapsed.toFixed(1)+'s</span>');
  };
  tick();
  return setInterval(tick, 200);
}

async function runTurn(userText){
  convo.push(userText);
  crumbs();
  clearChrome();
  document.getElementById("hint").textContent="";
  const depth = convo.length;
  const atMax = depth >= MAX_DEPTH;
  setBusy(true);
  const progressTimer = startProgress();
  try {
    const goal = buildGoal();
    const res = await fetch(API+"/v1/agent/runs",{method:"POST",headers:{"Content-Type":"application/json"},
      body:JSON.stringify({prompt:goal, respond_as:"ui", tenant_id:"course", project_id:"s14", user_id:"viewer", agent_id:"app"})});
    if(!res.ok) throw new Error("run request failed: HTTP "+res.status);
    const run = await res.json();
    const rid = run.run_id;
    const [c, g] = await Promise.all([
      fetch(API+"/v1/runs/"+rid+"/composed").then(r=>r.json()),
      fetch(API+"/v1/agent/runs/"+rid).then(r=>r.json()).catch(()=>null),
    ]);
    if(c.surface){
      render(c.surface);
      setStatus("");
      renderBadges(c, rid);
      if(g){ renderGraphPath(g); renderTimeline(g); }
      document.getElementById("hint").textContent = atMax
        ? "deepest level reached — press Ask to start a new topic"
        : "pick a subtopic to go deeper";
      // The header link defaults to the one fixed captured proof (flat tire).
      // The moment THIS session actually composes a Stepper for whatever the
      // user asked, repoint the link at that live run instead — "current
      // query", not always the same fixed example.
      if(c.surface.components.some(comp=>comp.type==="Stepper")){
        const link=document.getElementById("stepperLink");
        link.href="/s/"+rid;
        link.textContent="Stepper result for \""+userText+"\" →";
      }
    } else { setStatus("no interface composed"); }
  } catch(err) {
    setStatus('<span class="pill" style="background:var(--red-soft);color:var(--red-ink)">failed</span> '+String(err&&err.message||err));
  } finally {
    clearInterval(progressTimer);
    setBusy(false);
  }
}
function choose(label){ const clean=cleanLabel(label); if(clean && convo.length < MAX_DEPTH) runTurn(clean); }

// ---- topics dropdown: a few example queries, PLUS every real query
// actually asked (typed freely or picked), most recent first, persisted in
// localStorage so it isn't a fixed/restricted list — whatever you last
// typed shows up here too, not just the seed examples.
//
// The "often composes a Stepper" notes below are earned, not assumed: only
// these two survived live testing (repeated identical calls at
// temperature=0 — Stepper selection has real run-to-run variance; it is
// NOT guaranteed even for these). Several plausible-sounding "procedural"
// topics were tried and dropped from this list because they reliably did
// NOT produce a Stepper (a topic with a natural quantifiable fact — a
// ratio, a rate, a duration — tends to pull the model toward StatTile
// instead, since the system prompt steers numeric content there). ----
const EXAMPLE_TOPICS = [
  { query: "Change a flat tire on a car", note: "often composes a Stepper" },
  { query: "How to make a paper crane", note: "often composes a Stepper" },
  { query: "How to tie a bowline knot" },
  { query: "How to brew pour-over coffee" },
  { query: "Set up two-factor authentication on an email account" },
];
const RECENT_KEY = "s14_recent_queries";
const RECENT_MAX = 10;
function loadRecent(){ try{ return JSON.parse(localStorage.getItem(RECENT_KEY)||"[]"); }catch(_){ return []; } }
function saveRecent(query){
  const q = String(query||"").trim(); if(!q) return;
  let recent = loadRecent().filter(r=>r.toLowerCase()!==q.toLowerCase());
  recent.unshift(q);
  recent = recent.slice(0, RECENT_MAX);
  localStorage.setItem(RECENT_KEY, JSON.stringify(recent));
  renderTopicsDropdown();
}
function renderTopicsDropdown(){
  const sel = document.getElementById("stepperTopics");
  const recent = loadRecent();
  sel.innerHTML = "";
  const placeholder = document.createElement("option");
  placeholder.value = ""; placeholder.selected = true; placeholder.disabled = true;
  placeholder.textContent = "pick an example or a query you've asked before…";
  sel.append(placeholder);
  if(recent.length){
    const g = document.createElement("optgroup"); g.label = "your recent queries";
    recent.forEach(q=>{ const o=document.createElement("option"); o.textContent=q; g.append(o); });
    sel.append(g);
  }
  const g2 = document.createElement("optgroup"); g2.label = "example queries";
  EXAMPLE_TOPICS.forEach(item=>{ const o=document.createElement("option");
    o.value=item.query; o.textContent=item.note?item.query+"  —  "+item.note:item.query; g2.append(o); });
  sel.append(g2);
}
renderTopicsDropdown();

document.getElementById("ask").onclick=()=>{
  const value = document.getElementById("prompt").value.trim();
  saveRecent(value);   // remember EVERY real query asked, not just the seed examples
  convo=[]; runTurn(value);
};
document.getElementById("prompt").addEventListener("keydown",e=>{ if(e.key==="Enter") document.getElementById("ask").click(); });
document.getElementById("stepperTopics").addEventListener("change",e=>{
  const topic=e.target.value; if(!topic) return;
  document.getElementById("prompt").value=topic;
  document.getElementById("ask").click();
});
</script>
</body>
</html>
