<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>S14 app — the agent answers in UI</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap">
<style>
  :root{
    --bg:#F7F8FA;--surface:#FFF;--surface-alt:#FAFAFA;--ink:#111;--ink-body:#1A1A1A;--ink-muted:#555;
    --rule:#E8E8E8;--rule-strong:#D0D0D0;--accent:#2563EB;--accent-soft:rgba(37,99,235,.08);
    --green:#16A34A;--green-soft:rgba(22,163,74,.12);--green-ink:#15803D;
    --amber:#D97706;--amber-soft:rgba(217,119,6,.14);--amber-ink:#B45309;
    --red:#DC2626;--red-soft:rgba(220,38,38,.10);--red-ink:#B91C1C;
    --font-sans:'Inter',system-ui,sans-serif;--font-serif:'Palatino Linotype',Palatino,Georgia,serif;--font-mono:'JetBrains Mono',ui-monospace,Menlo,monospace;
  }
  *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink-body);font-family:var(--font-sans);font-size:15px}
  .wrap{max-width:720px;margin:0 auto;padding:22px 18px 60px}
  .head{display:flex;gap:8px;align-items:center;margin-bottom:6px;font-family:var(--font-mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-muted)}
  .startbar{display:flex;gap:8px;margin:10px 0 18px}
  .startbar input{flex:1;padding:11px 14px;border:1px solid var(--rule-strong);border-radius:10px;font-size:15px;font-family:var(--font-sans)}
  .startbar input:focus{outline:none;border-color:var(--accent)}
  .startbar button{padding:11px 18px;border:none;border-radius:10px;background:var(--ink);color:#fff;font-weight:600;font-size:14px;cursor:pointer}
  .status{font-family:var(--font-mono);font-size:12px;color:var(--ink-muted);min-height:18px;margin-bottom:10px;display:flex;gap:8px;align-items:center}
  .pill{padding:2px 9px;border-radius:999px;font-weight:600;font-size:11px}
  .pill.good{background:var(--green-soft);color:var(--green-ink)}.pill.think{background:var(--accent-soft);color:var(--accent)}
  .screen{background:var(--surface);border:1px solid var(--rule);border-radius:16px;padding:22px;box-shadow:0 4px 16px -8px rgba(0,20,60,.12);min-height:120px}
  .empty{color:var(--ink-muted);font-style:italic;text-align:center;padding:30px 0}
  .crumbs{font-family:var(--font-mono);font-size:11px;color:var(--ink-muted);margin-top:12px}
  /* component styles (mirror the S14 render client) */
  .Text{color:var(--ink-body);line-height:1.6;white-space:pre-wrap;margin:2px 0}
  .Text.heading{font-family:var(--font-serif);font-size:26px;font-weight:700;color:var(--ink);white-space:normal;margin:0 0 6px}
  .Text.subtitle{font-style:italic;color:var(--ink-muted);font-size:16px}
  .Text.caption{font-size:12px;color:var(--ink-muted);font-family:var(--font-mono)}
  .Column{display:flex;flex-direction:column;gap:14px}
  .List{display:flex;flex-direction:column;gap:10px}
  .Row{display:flex;gap:12px;align-items:stretch;flex-wrap:wrap}
  .Row>.StatTile,.Row>.chart{flex:1;min-width:120px}
  .Card{background:var(--surface-alt);border:1px solid var(--rule);border-radius:12px;padding:14px 16px}
  .Card>.ct{font-weight:600;margin-bottom:8px}
  .Divider{height:1px;background:var(--rule)}
  .StatTile{background:var(--surface);border:1px solid var(--rule);border-top:3px solid var(--accent);border-radius:12px;padding:14px}
  .StatTile .lab{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-muted);font-weight:600;font-family:var(--font-mono)}
  .StatTile .val{font-size:28px;font-weight:700;color:var(--ink);margin-top:5px}
  .StatTile .dl{font-size:11px;color:var(--ink-muted);margin-top:3px}
  .chart{background:var(--surface);border:1px solid var(--rule);border-radius:12px;padding:14px}
  .chart .ct{font-size:12px;font-weight:600;color:var(--ink-muted);margin-bottom:8px;font-family:var(--font-mono)}
  .prog{height:12px;border-radius:999px;background:var(--surface-alt);border:1px solid var(--rule);overflow:hidden}.prog>i{display:block;height:100%;background:var(--green)}
  table{width:100%;border-collapse:collapse;background:var(--surface);border:1px solid var(--rule);border-radius:12px;overflow:hidden}
  th,td{text-align:left;padding:9px 12px;border-bottom:1px solid var(--rule);font-size:14px}
  th{font-family:var(--font-mono);font-size:11px;text-transform:uppercase;color:var(--ink-muted);background:var(--surface-alt)}
  tr:last-child td{border-bottom:none}
  .tabs{display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap}
  .tabs button{border:1px solid var(--rule-strong);background:var(--surface);border-radius:999px;padding:5px 13px;font-size:13px;font-weight:600;cursor:pointer;font-family:var(--font-mono);color:var(--ink-muted)}
  .tabs button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
  .Notice{border-left:4px solid var(--amber);background:var(--amber-soft);border-radius:10px;padding:12px 14px}
  .cb{background:var(--surface);border:1px solid var(--rule);border-radius:12px;overflow:hidden}
  .cb .cbh{display:flex;align-items:center;padding:6px 12px;background:var(--surface-alt);border-bottom:1px solid var(--rule);font-family:var(--font-mono);font-size:11px;color:var(--ink-muted)}
  .cb .cbh .lang{text-transform:uppercase;letter-spacing:.05em;font-weight:600}
  .cb .cbh .cbt{flex:1;margin-left:10px;color:var(--ink-body);text-transform:none;letter-spacing:0;font-weight:500}
  .cb .cbh button{border:1px solid var(--rule-strong);background:var(--surface);border-radius:6px;padding:3px 10px;font-family:var(--font-mono);font-size:11px;cursor:pointer;color:var(--ink-muted)}
  .cb pre{margin:0;padding:12px 0;overflow-x:auto;font-family:var(--font-mono);font-size:12.5px;line-height:1.55}
  .cb .cbr{display:flex}
  .cb .cbr .gutter{color:var(--ink-muted);text-align:right;padding:0 10px 0 12px;user-select:none;opacity:.55;border-right:1px solid var(--rule);min-width:28px}
  .cb .cbr .body{padding:0 12px;flex:1;white-space:pre;color:var(--ink-body)}
  .cb .tok-keyword{color:#7c3aed;font-weight:600}
  .cb .tok-builtin{color:#0891b2}
  .cb .tok-type,.cb .tok-class-name{color:#0e7490;font-weight:500}
  .cb .tok-function{color:#2563EB}
  .cb .tok-decorator{color:#B45309;font-style:italic}
  .cb .tok-string,.cb .tok-regex{color:#15803D}
  .cb .tok-number{color:#B45309}
  .cb .tok-boolean,.cb .tok-null-value{color:#7c3aed;font-weight:600}
  .cb .tok-comment{color:var(--ink-muted);font-style:italic}
  .cb .tok-operator{color:#334155}
  .cb .tok-punctuation{color:#64748b}
  .cb .tok-identifier{color:var(--ink-body)}
  .actbtn{width:100%;text-align:center;border:1px solid var(--rule-strong);background:var(--surface);border-radius:12px;padding:14px;font-weight:600;font-size:15px;cursor:pointer;color:var(--ink);transition:all 120ms}
  .actbtn:hover{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
  .actbtn:active{transform:translateY(1px)}
  input.field,select.field{padding:9px 11px;border:1px solid var(--rule-strong);border-radius:9px;font-size:14px;font-family:var(--font-sans)}
  /* safe markdown (built as DOM, never innerHTML) */
  .Text .md-h{font-weight:700;color:var(--ink);margin:12px 0 4px}
  .Text .md-p{margin:6px 0;line-height:1.6}
  .Text .md-ul{margin:6px 0 6px 4px;padding-left:18px}
  .Text .md-ul li{margin:3px 0;line-height:1.55}
</style>
</head>
<body>
<div class="wrap">
  <div class="head"><span>S14 app · the agent answers in UI</span><span style="margin-left:auto">bare-minimal shell · the protocol does the work</span></div>
  <div class="startbar">
    <input id="prompt" value="Teach me for IIT JEE. Ask me which subject to study." />
    <button id="ask">Ask</button>
  </div>
  <div class="status" id="status"></div>
  <div class="screen"><div id="mount"><div class="empty">Type a goal and press Ask. Every reply is a live interface the agent composes.</div></div></div>
  <div class="crumbs" id="crumbs"></div>
</div>
<script>
// ---- the render engine: maps trusted catalog types to DOM. It NEVER sets
// innerHTML from a bound value and NEVER evaluates any string. A component is
// data; a widget draws it. Buttons feed the next turn; that is the only way the
// interface changes the world. ----
const API = "";                     // same origin as the runtime (8113)
let convo = [];                     // the running conversation (context for each turn)
const $ = (t,c)=>{const e=document.createElement(t);if(c)e.className=c;return e;};
const T = t=>document.createTextNode(t==null?"":String(t));
const resolve=(v,dm)=>(v&&typeof v==="object"&&"$bind"in v)?ptr(dm,v["$bind"]):v;
function ptr(dm,p){let c=dm;for(const s of String(p).split("/").slice(1)){if(c==null)return null;c=c[s];}return c;}

// ---- safe markdown: parse the model's text into DOM (createElement + text nodes).
// It NEVER uses innerHTML, so any HTML/script in the text stays literal text. ----
function mdInline(line,parent){
  const re=/(\*\*([^*]+)\*\*|\*([^*]+)\*|_([^_]+)_)/g;let last=0,m;
  while((m=re.exec(line))){
    if(m.index>last)parent.append(T(line.slice(last,m.index)));
    if(m[2]!=null){const s=document.createElement("strong");s.textContent=m[2];parent.append(s);}
    else{const e=document.createElement("em");e.textContent=(m[3]!=null?m[3]:m[4]);parent.append(e);}
    last=re.lastIndex;
  }
  if(last<line.length)parent.append(T(line.slice(last)));
}
function md(text){
  const frag=document.createDocumentFragment();let ul=null;
  for(const raw of String(text==null?"":text).split(/\r?\n/)){
    const line=raw.trim();if(!line){ul=null;continue;}
    const h=line.match(/^(#{1,4})\s+(.*)/),b=line.match(/^[*\-]\s+(.*)/);
    if(h){ul=null;const d=$("div","md-h");mdInline(h[2],d);frag.append(d);}
    else if(b){if(!ul){ul=document.createElement("ul");ul.className="md-ul";frag.append(ul);}const li=document.createElement("li");mdInline(b[1],li);ul.append(li);}
    else{ul=null;const p=$("div","md-p");mdInline(line,p);frag.append(p);}
  }
  return frag;
}

const R={
  Column:(c,x)=>{const e=$("div","Column");kids(c,x,e);return e;},
  Row:(c,x)=>{const e=$("div","Row");kids(c,x,e);return e;},
  List:(c,x)=>{const e=$("div","List");kids(c,x,e);return e;},
  Card:(c,x)=>{const e=$("div","Card");if(c.title){const h=$("div","ct");h.append(T(c.title));e.append(h);}kids(c,x,e);return e;},
  Divider:()=>$("div","Divider"),
  Text:(c,x)=>{const e=$("div","Text "+(c.variant||"body"));const v=resolve(c.text,x.dm);
    if((c.variant||"body")==="heading"){e.append(T(v));}else{e.append(md(v));}return e;},
  Notice:(c,x)=>{const e=$("div","Notice");e.append(T(resolve(c.text,x.dm)));return e;},
  CodeBlock:(c,x)=>renderCodeBlock(c,x),
  StatTile:(c,x)=>{const e=$("div","StatTile");const l=$("div","lab");l.append(T(c.label));const v=$("div","val");v.append(T(String(resolve(c.value,x.dm))+(c.unit?" "+c.unit:"")));const d=$("div","dl");d.append(T(resolve(c.delta,x.dm)||""));e.append(l,v,d);return e;},
  Timeline:(c,x)=>{const e=$("div","chart");const t=$("div","ct");t.append(T(c.title||"timeline"));const b=$("div");b.style.cssText="display:flex;flex-direction:column;gap:8px;margin-top:4px";(resolve(c.events,x.dm)||[]).forEach(ev=>{const r=$("div");r.style.cssText="display:flex;gap:10px;align-items:flex-start;font-size:14px";const dot=$("span");dot.textContent="●";dot.style.cssText="color:var(--accent);font-size:10px;margin-top:5px";const lab=$("div");lab.style.flex="1";mdInline(String(ev.label!=null?ev.label:(ev.kind!=null?ev.kind:JSON.stringify(ev))),lab);r.append(dot,lab);b.append(r);});e.append(t,b);return e;},
  ProgressBar:(c,x)=>{const e=$("div","chart");const t=$("div","ct");t.append(T("progress"));const p=$("div","prog");const i=$("i");const val=+resolve(c.value,x.dm)||0;i.style.width=Math.min(100,val/(c.max||100)*100)+"%";p.append(i);e.append(t,p);return e;},
  Sparkline:(c,x)=>{const e=$("div","chart");const t=$("div","ct");t.append(T("trend"));e.append(t,spark(resolve(c.data,x.dm)||[]));return e;},
  BarChart:(c,x)=>{const e=$("div","chart");const t=$("div","ct");t.append(T(c.title||"chart"));e.append(t,bars(resolve(c.data,x.dm)||[],c.xKey,c.yKey));return e;},
  DataTable:(c,x)=>table(c,x),
  Tabs:(c,x)=>tabs(c,x),
  Button:(c,x)=>{const b=$("button","actbtn");let lab=resolve(c.label,x.dm);if(lab&&typeof lab==="object")lab=lab.label||lab.name||lab.text||lab.id||"Choose";lab=String(lab==null?"Choose":lab);b.append(T(lab));b.onclick=()=>choose(lab);return b;},
  Image:(c,x)=>{const e=$("div","chart");e.append(T("[image]"));return e;},
  TextField:(c,x)=>{const w=$("div");if(c.label){const l=$("div","lab");l.append(T(c.label));w.append(l);}const i=$("input","field");i.placeholder=c.placeholder||"";w.append(i);return w;},
  CheckBox:(c,x)=>{const w=$("label");w.style.display="flex";w.style.gap="8px";const i=document.createElement("input");i.type="checkbox";w.append(i,T(c.label||""));return w;},
  Slider:(c,x)=>{const w=$("div");if(c.label){const l=$("div","lab");l.append(T(c.label));w.append(l);}const i=document.createElement("input");i.type="range";i.min=c.min||0;i.max=c.max||100;w.append(i);return w;},
  InputChoice:(c,x)=>{const s=$("select","field");(resolve(c.options,x.dm)||[]).forEach(o=>{const op=document.createElement("option");op.append(T(typeof o==="object"?(o.name||o.label||o.id):o));s.append(op);});return s;},
  DateTime:(c,x)=>{const i=$("input","field");i.type="date";return i;},
  Modal:(c,x)=>{const e=$("div","Card");if(c.title){const h=$("div","ct");h.append(T(c.title));e.append(h);}kids(c,x,e);return e;},
  ApprovalCard:(c,x)=>{const e=$("div","Card");const s=$("div","ct");s.append(T(resolve(c.summary,x.dm)||"Approve?"));const pre=document.createElement("pre");pre.style.cssText="font-size:12px;background:var(--surface-alt);padding:8px;border-radius:8px;overflow:auto";pre.append(T(JSON.stringify(resolve(c.params,x.dm),null,2)));const ok=$("button","actbtn");ok.append(T("Approve"));ok.onclick=()=>choose("approve");e.append(s,pre,ok);return e;},
};
function kids(c,x,e){for(const id of (c.children||[])){const ch=x.byId[id];if(ch)e.append(node(ch,x));}}
function node(c,x){const f=R[c.type];if(!f){const s=$("div");s.style.cssText="color:var(--red-ink);font-family:var(--font-mono);font-size:11px";s.append(T("[skipped "+c.type+"]"));return s;}return f(c,x);}
function spark(v){const ns="http://www.w3.org/2000/svg",w=200,h=44,mx=Math.max(...v,1),mn=Math.min(...v,0),rg=(mx-mn)||1;const s=document.createElementNS(ns,"svg");s.setAttribute("viewBox",`0 0 ${w} ${h}`);s.setAttribute("width","100%");s.setAttribute("height",h);const p=document.createElementNS(ns,"polyline");p.setAttribute("points",v.map((y,i)=>`${i/(v.length-1||1)*w},${h-5-(y-mn)/rg*(h-10)}`).join(" "));p.setAttribute("fill","none");p.setAttribute("stroke","var(--green)");p.setAttribute("stroke-width","2.5");s.append(p);return s;}
function bars(d,xk,yk){const ns="http://www.w3.org/2000/svg",w=300,h=150,pad=24,mx=Math.max(...d.map(r=>+r[yk]),1),bw=(w-pad*2)/(d.length||1)*.6;const s=document.createElementNS(ns,"svg");s.setAttribute("viewBox",`0 0 ${w} ${h}`);s.setAttribute("width","100%");d.forEach((r,i)=>{const x=pad+i*((w-pad*2)/d.length)+((w-pad*2)/d.length-bw)/2,bh=(+r[yk])/mx*(h-pad*2);const rc=document.createElementNS(ns,"rect");rc.setAttribute("x",x);rc.setAttribute("y",h-pad-bh);rc.setAttribute("width",bw);rc.setAttribute("height",bh);rc.setAttribute("rx",3);rc.setAttribute("fill","var(--accent)");s.append(rc);const tl=document.createElementNS(ns,"text");tl.setAttribute("x",x+bw/2);tl.setAttribute("y",h-8);tl.setAttribute("text-anchor","middle");tl.setAttribute("font-size","9");tl.setAttribute("fill","var(--ink-muted)");tl.textContent=r[xk];s.append(tl);});return s;}
// ---- CodeBlock: syntax highlighting via per-language regex grammars.
// Each grammar is an ordered list of {name, re}. The tokeniser walks the
// string, tries each rule at the cursor, first-match wins, emits one token,
// advances. It NEVER parses the source, NEVER evaluates it, NEVER treats any
// bound value as executable — every span is a text node.
const CB_WORD=(words,kind)=>new RegExp("^(?:"+words.join("|")+")\\b");
const CB_NUMBER=/^(?:0[xX][0-9a-fA-F_]+|0[bB][01_]+|0[oO][0-7_]+|(?:\d[\d_]*(?:\.\d[\d_]*)?|\.\d[\d_]*)(?:[eE][+-]?\d[\d_]*)?)[LlnfFdDuU]?/;
const CB_GRAMMARS={};
const PY_KEYWORDS=["False","None","True","and","as","assert","async","await","break","class","continue","def","del","elif","else","except","finally","for","from","global","if","import","in","is","lambda","match","case","nonlocal","not","or","pass","raise","return","try","while","with","yield"];
const PY_BUILTINS=["abs","all","any","ascii","bin","bool","bytearray","bytes","callable","chr","classmethod","compile","complex","delattr","dict","dir","divmod","enumerate","eval","exec","filter","float","format","frozenset","getattr","globals","hasattr","hash","help","hex","id","input","int","isinstance","issubclass","iter","len","list","locals","map","max","memoryview","min","next","object","oct","open","ord","pow","print","property","range","repr","reversed","round","set","setattr","slice","sorted","staticmethod","str","sum","super","tuple","type","vars","zip","self","cls"];
CB_GRAMMARS.python=[
  {name:"comment",re:/^#[^\n]*/},
  {name:"string",re:/^(?:[rRbBuU]|[rR][bB]|[bB][rR])?"""[\s\S]*?"""/},
  {name:"string",re:/^(?:[rRbBuU]|[rR][bB]|[bB][rR])?'''[\s\S]*?'''/},
  {name:"string",re:/^(?:[fF][rR]?|[rR][fF])"(?:\\.|[^"\\\n])*"/},
  {name:"string",re:/^(?:[fF][rR]?|[rR][fF])'(?:\\.|[^'\\\n])*'/},
  {name:"string",re:/^(?:[rRbBuU]|[rR][bB]|[bB][rR])?"(?:\\.|[^"\\\n])*"/},
  {name:"string",re:/^(?:[rRbBuU]|[rR][bB]|[bB][rR])?'(?:\\.|[^'\\\n])*'/},
  {name:"decorator",re:/^@[A-Za-z_][\w.]*/},
  {capture:["keyword","whitespace","class-name"],re:/^(class)(\s+)([A-Za-z_]\w*)/},
  {capture:["keyword","whitespace","function"],re:/^(def)(\s+)([A-Za-z_]\w*)/},
  {name:"keyword",re:CB_WORD(PY_KEYWORDS,"keyword")},
  {name:"boolean",re:/^(?:True|False)\b/},
  {name:"null-value",re:/^None\b/},
  {name:"builtin",re:CB_WORD(PY_BUILTINS,"builtin")},
  {name:"function",re:/^[A-Za-z_]\w*(?=\s*\()/},
  {name:"identifier",re:/^[A-Za-z_]\w*/},
  {name:"number",re:CB_NUMBER},
  {name:"operator",re:/^(?:\*\*=?|\/\/=?|<<=?|>>=?|[!=<>]=|:=|->|[-+*/%&|^~=<>!])/},
  {name:"punctuation",re:/^[(){}\[\],.;:@]/},
];
const JS_KEYWORDS=["async","await","break","case","catch","class","const","continue","debugger","default","delete","do","else","enum","export","extends","finally","for","from","function","get","if","import","in","instanceof","let","new","of","return","set","static","super","switch","this","throw","try","typeof","var","void","while","with","yield"];
const JS_BUILTINS=["Array","Boolean","Date","Error","Function","JSON","Map","Math","Number","Object","Promise","RegExp","Set","String","Symbol","WeakMap","WeakSet","console","document","window","globalThis","process","require","module","exports"];
CB_GRAMMARS.javascript=[
  {name:"comment",re:/^\/\/[^\n]*/},{name:"comment",re:/^\/\*[\s\S]*?\*\//},
  {name:"string",re:/^`(?:\\.|[^`\\])*`/},
  {name:"string",re:/^"(?:\\.|[^"\\\n])*"/},{name:"string",re:/^'(?:\\.|[^'\\\n])*'/},
  {name:"regex",re:/^\/(?![*+?])(?:[^\r\n\[\/\\]|\\.|\[(?:[^\r\n\]\\]|\\.)*\])+\/[gimsuy]*/},
  {capture:["keyword","whitespace","class-name"],re:/^(class)(\s+)([A-Za-z_$][\w$]*)/},
  {capture:["keyword","whitespace","function"],re:/^(function)(\s+)([A-Za-z_$][\w$]*)/},
  {name:"keyword",re:CB_WORD(JS_KEYWORDS,"keyword")},
  {name:"boolean",re:/^(?:true|false)\b/},
  {name:"null-value",re:/^(?:null|undefined)\b/},
  {name:"builtin",re:CB_WORD(JS_BUILTINS,"builtin")},
  {name:"type",re:/^[A-Z][A-Za-z0-9_$]*/},
  {name:"function",re:/^[A-Za-z_$][\w$]*(?=\s*\()/},
  {name:"identifier",re:/^[A-Za-z_$][\w$]*/},
  {name:"number",re:CB_NUMBER},
  {name:"operator",re:/^(?:={1,3}|!={0,2}|<={1,2}|>={1,2}|\|\|=?|&&=?|\?\?=?|\?\.|\.\.\.|\+\+|--|\*\*=?|<<=?|>>>?=?|[-+*/%&|^~<>!?]=?)/},

function resolveLang(language){
  const raw=String(language==null?"":language).trim().toLowerCase();
  const canonical=CB_ALIASES[raw]||raw;
  return CB_GRAMMARS[canonical]?canonical:"text";
}
function tokenizeCode(code,language){
  const grammar=CB_GRAMMARS[resolveLang(language)]||CB_GRAMMARS.text;
  const out=[];let s=String(code==null?"":code);let guard=s.length*4+16;
  while(s.length&&guard-->0){
    const ws=/^\s+/.exec(s);
    if(ws){out.push({kind:"whitespace",text:ws[0]});s=s.slice(ws[0].length);continue;}
    let matched=false;
    for(const rule of grammar){
      const m=rule.re.exec(s);if(!m)continue;
      if(rule.capture){
        // See index.html for the rationale.
        for(let i=0;i<rule.capture.length;i++){
          const seg=m[i+1];if(!seg)continue;
          out.push({kind:rule.capture[i],text:seg});
        }
      } else {
        out.push({kind:rule.name,text:m[0]});
      }
      s=s.slice(m[0].length);matched=true;break;
    }
    if(!matched){out.push({kind:"text",text:s[0]});s=s.slice(1);}
  }
  return out;
}
function renderCodeBlock(c,x){
  const wrap=$("div","cb");
  const raw=String(resolve(c.code,x.dm)??"");
  const displayLang=String(c.language==null?"text":c.language).trim()||"text";
  const head=$("div","cbh");
  const langLabel=$("span","lang");langLabel.append(T(displayLang));head.append(langLabel);
  if(c.title){const tt=$("span","cbt");tt.append(T(c.title));head.append(tt);}
  if(c.onCopy&&c.onCopy.action){
    const btn=document.createElement("button");btn.append(T("copy"));
    btn.onclick=()=>{
      if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(raw).catch(()=>{});}
      btn.textContent="copied";setTimeout(()=>{btn.textContent="copy";},1200);
    };
    head.append(btn);
  }
  wrap.append(head);
  const pre=document.createElement("pre");
  const row=$("div","cbr");
  const gutter=$("div","gutter");const body=$("div","body");
  const tokens=tokenizeCode(raw,displayLang);
  let line=1;
  const gf=document.createDocumentFragment();
  const gl=()=>{const l=document.createElement("div");l.textContent=String(line);gf.append(l);};
  gl();
  for(const tok of tokens){
    const parts=tok.text.split("\n");
    for(let i=0;i<parts.length;i++){
      if(i>0){body.append(document.createTextNode("\n"));line++;gl();}
      if(!parts[i])continue;
      if(tok.kind==="whitespace"||tok.kind==="text"){body.append(document.createTextNode(parts[i]));}
      else{const sp=document.createElement("span");sp.className="tok-"+tok.kind;sp.textContent=parts[i];body.append(sp);}
    }
  }
  gutter.append(gf);row.append(gutter,body);pre.append(row);wrap.append(pre);
  return wrap;
}
function table(c,x){const wrap=$("div");const cols=(c.columns||"").split(",").map(s=>s.trim());const rows=resolve(c.rows,x.dm)||[];const t=$("table");const tr=$("tr");cols.forEach(col=>{const th=$("th");th.append(T(col));tr.append(th);});t.append(tr);rows.forEach(r=>{const rr=$("tr");cols.forEach(col=>{const td=$("td");td.append(T(r[col]));rr.append(td);});t.append(rr);});wrap.append(t);return wrap;}
function tabs(c,x){const wrap=$("div");const nav=$("div","tabs");const body=$("div");wrap.append(nav,body);const tabIds=c.children||[];function show(i){body.textContent="";const cc=x.byId[tabIds[i]];if(cc)body.append(node(cc,x));[...nav.children].forEach((b,j)=>b.classList.toggle("on",i===j));}
  (String(c.labels||"").split(",")).forEach((lab,i)=>{const b=$("button");b.append(T(lab.trim()||("tab "+(i+1))));b.onclick=()=>show(i);nav.append(b);});
  if(tabIds.length)show(0);return wrap;}

function render(surface){const byId={};surface.components.forEach(c=>byId[c.id]=c);const x={byId,dm:surface.dataModel||{}};const m=document.getElementById("mount");m.textContent="";m.append(node(byId[surface.root],x));}

// ---- the app loop: a tap becomes the next turn ----
function setStatus(html){document.getElementById("status").innerHTML=html;}
function crumbs(){document.getElementById("crumbs").textContent = convo.length? "conversation: "+convo.join("  ›  ") : "";}

async function runTurn(userText){
  convo.push(userText);
  crumbs();
  setStatus('<span class="pill think">composing…</span> the agent is writing an interface for: "'+userText+'"');
  const goal = convo.length===1 ? convo[0]
     : convo[0] + "\nSo far the user then picked: " + convo.slice(1).join(", then ") + ".\nRespond with the next interface for that.";
  const res = await fetch(API+"/v1/agent/runs",{method:"POST",headers:{"Content-Type":"application/json"},
    body:JSON.stringify({prompt:goal, respond_as:"ui", tenant_id:"course", project_id:"s14", user_id:"viewer", agent_id:"app"})});
  const run = await res.json();
  const rid = run.run_id;
  const c = await (await fetch(API+"/v1/runs/"+rid+"/composed")).json();
  if(c.surface){ render(c.surface);
    setStatus('<span class="pill good">'+(c.provider||"gemini")+' · '+c.component_count+' components · 0 executable</span> composed live, validated in-catalog'); }
  else { setStatus("no interface composed"); }
}
function choose(label){ if(label) runTurn(label); }

document.getElementById("ask").onclick=()=>{ convo=[]; runTurn(document.getElementById("prompt").value.trim()); };
document.getElementById("prompt").addEventListener("keydown",e=>{ if(e.key==="Enter") document.getElementById("ask").click(); });
