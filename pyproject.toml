[project]
name = "eagv3-s14code"
version = "0.1.0"
description = "Session 14 runtime: the full Session 13 live graph, memory, semantic chunking and A2A runtime with the Session 14 generative-UI layer folded in as one service"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "pydantic>=2.6",
    "cryptography>=42",
    "grpcio>=1.70",
    "a2a-sdk[grpc]>=1.0,<2",
    "faiss-cpu>=1.11,<2",
    "modal>=1.5.3",
    "jsonschema>=4.21",
    "pyyaml>=6.0",
    "websockets>=12.0",
]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.6"]

[project.scripts]
s13code = "s13code.cli:main"
s14code = "s13code.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["s13code"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests", "s13code/core"]

[tool.ruff]
line-length = 110
target-version = "py311"
extend-exclude = [
    "s13code/core/a2a_adapter/a2a_s13_pb2.py",
    "s13code/core/a2a_adapter/a2a_s13_pb2_grpc.py",
]

[tool.ruff.lint]
# A few teaching examples intentionally keep tiny state transitions on one
# line. Generated protobuf modules are excluded above and remain reproducible.
ignore = ["E701", "E702"]

[tool.ruff.lint.per-file-ignores]
"s13code/core/a2a_adapter/tests/test_hardening.py" = ["F401"]
