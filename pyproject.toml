[project]
name = "eagv3-s14code"
version = "0.1.0"
description = "Session 14 runtime: the full Session 13 live graph, memory, semantic chunking and A2A runtime with the Session 14 generative-UI layer folded in as one service"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "pydantic>=2.6",
    "cryptography>=42",
    "grpcio>=1.70",
    "a2a-sdk[grpc]>=1.0,<2",
    "faiss-cpu>=1.11,<2",
]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.6"]

[project.scripts]
s13code = "s13code.cli:main"
s14code = "s13code.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["s13code"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests", "s13code/core"]

[tool.ruff]
line-length = 110
target-version = "py311"
extend-exclude = [
    "s13code/core/a2a_adapter/a2a_s13_pb2.py",
    "s13code/core/a2a_adapter/a2a_s13_pb2_grpc.py",
]

[tool.ruff.lint]
# A few teaching examples intentionally keep tiny state transitions on one
# line. Generated protobuf modules are excluded above and remain reproducible.
#
# BLE001/S110: worker/task/push/parse boundaries deliberately catch Exception
# broadly so one failing node, delivery attempt, or malformed model reply
# degrades to a visible failure (a Notice, a retry, a fallback parse) instead
# of crashing the graph or the request — the same "honest failure" contract
# the S14 surface builder documents for a failed node.
# TRY004: ConstrainedGraphPatchPlanner._parse validates untrusted LLM JSON
# shape AND type together; ValueError is the correct signal for "not a valid
# GraphPatch", not a plain TypeError.
# DTZ007: the birthday reminder only ever needs a calendar date, never a
# timezone-aware instant.
ignore = ["E701", "E702", "BLE001", "S110", "TRY004", "DTZ007"]

[tool.ruff.lint.per-file-ignores]
"s13code/core/a2a_adapter/tests/test_hardening.py" = ["F401"]
